ct the standard accessory options to purchase with it. These standard options are: carrying case, screen cleaner, tablet stand, and screen protector. What approach would you take? (Choose three.)","o":["Create Catalog Item for the Tablet, and add a variable set to the form, for the accessory options.","Create a Record producer, and on the form, add a check box variable for each accessory option.","On Shopping Cart configuration, select option lo show the Add Accessories button.","Create one Catalog item for each: tablet, carrying case, screen cleaner, tablet stand, and screen protector.","Create Catalog Item for the tablet, and on the form, add a check box variable for each accessory option."],"a":[0,3,4]},{"n":111,"p":31,"q":"Which ServiceNow utility provides a modern interactive graphical interface to visualize configuration items and their relationships?","o":["Dependency View","CI Class Map","Business Service Map","CSDM Schema"],"a":[0]},{"n":112,"p":31,"q":"Which one of the following statements applies to a set of fields when they are coalesced during an import?","o":["If a match is found using the coalesce fields, the existing record is updated with the information being imported","If a match is not found using the coalesce fields, the system does not create a Transform Map","If a match is found using the coalesce fields, the system creates a new record","If a match is not found using the coalesce fields, the existing record is updated with the information being imported"],"a":[0]},{"n":113,"p":32,"q":"Which one of the following statements is true about Column Context Menus?","o":["It displays actions such as creating quick reports, configuring the list, and exporting data","It displays actions related to filtering options, assigning tags, and search","It displays actions related to viewing and filtering the entire list","It displays actions such as view form, view related task, and add relationship"],"a":[0]},{"n":114,"p":32,"q":"What is the definition of a group?","o":["A collection of subject matter experts","A team of users","An escalation pod","A collection of users","A department"],"a":[3]},{"n":115,"p":32,"q":"On the Reports page, what sections allow you to see which reports are visible to different audiences? (Choose four.)","o":["Group","Department","My reports","Team","Global","All"],"a":[0,2,4,5]},{"n":116,"p":33,"q":"On a filter condition, there is an element, which is based on the table, the user access rights, and columns on the table. What is this element called?","o":["Label","Column","Data Element","Field","Attribute"],"a":[3]},{"n":117,"p":33,"q":"You have been asked to create a way for users to order a new iPhone, but only if they get two levels of approval. The approvers and users should be automatically notified at each approval level. What feature would you use to manage the approvals and notifications?","o":["Approval Chains","Flows","Approver Delegates","Parent-Child Approvers","Approval Criteria"],"a":[1]},{"n":118,"p":33,"q":"Groups are stored in what table?","o":["User Group [user_groups]","Groups [sys_user_groups]","Group [sn_sys_user_group]","Group [sys_user_group]","User Groups [sn_user_groups]"],"a":[3]},{"n":119,"p":33,"q":"When managing tags, you can adjust who is able to see it. What are the visibility options? (Choose three.)","o":["Groups and Users","Me","Roles and Permissions","Everyone","Admins"],"a":[0,1,3]},{"n":120,"p":34,"q":"What module enables an administrator to define destinations for imported data on any ServiceNow table?","o":["Field Transform","Schema Map","Transform Map","Import Map"],"a":[2]},{"n":121,"p":34,"q":"On the Form header, which icon do you use to access form templates?","o":["Stamp","Pages","More Options (...)","Paperclip"],"a":[2]},{"n":122,"p":34,"q":"When using the Data Pill Picker, use which keys to dot-walk to fields in other tables?","o":["Plus, Minus","Ctrl <, Ctrl >","Arrows","Ctrl C, Ctrl V","Shift F4, Shift F5"],"a":[2]},{"n":123,"p":34,"q":"In what order are Access Controls evaluated?","o":["Field-level - most specific to most general; then Table-level - most specific to most general","Field-level - most general to most specific; then Row-level - most specific to most general","Table-level - most specific to most general; then Field-level - most specific to most general","Table-level - most specific to most general, then Row-level - most specific to most general"],"a":[2]},{"n":124,"p":35,"q":"Which ServiceNow products can be used to discover and populate the CMDB? (Choose two.)","o":["Discovery","IntegrationHub ETL","Finder","CMDB Plug-in","CMDB Integration Dashboard"],"a":[0,1]},{"n":125,"p":35,"q":"What instance resource allows you to access guided tours, information about actions, and instructions on how to use inputs and outputs in your flow?","o":["Docs","Community","Help Panel (question mark icon)","Wiki"],"a":[2]},{"n":126,"p":35,"q":"The Report Designer contains different sections for configuring your report. Which section is used to specify grouping and calculations to be run against the data?","o":["Style","Group by","Configure","Format","Data"],"a":[2]},{"n":127,"p":36,"q":"What icon do you use to change the icon and color on a Favorite?","o":["Clock","Pencil","Triangle","Star"],"a":[1]},{"n":128,"p":36,"q":"You have heard about a new application released by ServiceNow. You want to try it out, to see if it might be useful for your company's ServiceNow implementation. What would be the best way to get hands-on experience with the new application?","o":["Search the wiki for the sales demo request form","Check the latest release notes at docs servicenow.com","Activate the application plug in, on your personal dev instance","Activate the application plug in, on your company's production instance."],"a":[2]},{"n":129,"p":36,"q":"When looking at a long list of records, you want to quickly filter, to show only those which have Category of Hardware. How might you do that?","o":["On the Category column header, right click and select Show > Hardware","Right click on magnifier, type Hardware and click enter","On the list, locate and right click on the value Hardware, select Show Matching","On Breadcrumb, click > icon, type Hardware and click enter","Click Funnel icon, type Hardware and click enter"],"a":[2]},{"n":130,"p":36,"q":"When looking at a long list of records, you want to quickly filter, to show only those which have Short Description containing email. How might you do that?","o":["Click List Magnifier to expand column search, on Short Description, type email, click enter","On Search box, select text, type email, click enter","Click List Magnifier to expand column search, on Short Description, type *email, click enter","Click List Magnifier to expand column search, on Short Description, type %email, click enter"],"a":[2]},{"n":131,"p":37,"q":"When importing spreadsheet data into ServiceNow, what is the first step in the process?","o":["Run Data Scrubber","Set Coalesce","Select Import Set","Load Data","Define Data Source"],"a":[3]},{"n":132,"p":37,"q":"Tables may be set up with Many to Many relationships. What is a classic example of a scenario where the tables would have many to many relationships?","o":["Vendors can sell multiple products; and products can be sold by multiple vendors.","A Task can trigger many Workflows; and a Workflow can trigger many Tasks.","Requests can contain many Items; and Items can be any item from the catalog.","A Configuration Item can belong to multiple Classes, and Classes can contain multiple Configuration Items."],"a":[0]},{"n":133,"p":37,"q":"What section on a task record would you use to see the most recent update made to a record?","o":["Audit Log","Timeline","Activity","Journal"],"a":[2]},{"n":134,"p":37,"q":"The Employee On-boarding team has asked for a way for managers to order computers, monitors, business cards, and cell phones for new employees. How would you proceed to meet this requirement?","o":["Create Requested Item","Create Record Producer","Create On-boarding Bot","Create Order Guide"],"a":[3]},{"n":135,"p":38,"q":"When using the Load Data and Transform Map process, what is the Mapping Assist used for?","o":["Mapping fields using the Import Log","Mapping fields using Transform History","Mapping fields using an SLA","Mapping fields using a Field Map"],"a":[3]},{"n":136,"p":38,"q":"On the CI Dependency View, what enables you to trace from an infrastructure item, like a Server, to the Services that are dependent on that Server?","o":["Automapping Utility","Relationships","Service Tracer","Transform Map"],"a":[1]},{"n":137,"p":38,"q":"From a related list, what would a user click to personalize the layout of the columns?","o":["Gear","Context Menu","Pencil","Magnifier"],"a":[0]},{"n":138,"p":38,"q":"What is the language used for scripting in ServiceNow?","o":["C++","JavaScript","PHP","Python"],"a":[1]},{"n":139,"p":39,"q":"What are examples of UI Actions, relating to Lists? (Choose four.)","o":["List Links","List Choices","List Buttons","List Override","List Context Menu","List Control"],"a":[0,1,2,4]},{"n":140,"p":39,"q":"A Service Catalog project will involve building 80 catalog items. For each of the catalog items, the following fields will be mandatory on the forms:\n• Requested for\n• Requested by\n• Approving manager\n• Delivery instructions\nAll of the other variables will be specific to the individual catalog item. What features would you use when designing the catalog item form?","o":["Create a Variable Set Template, then apply to all of the catalog items.","Create one Variable Set for the four variables, then add that variable set to each of the 80 catalog items.","Create a Record Producer that contains the four fields; then add to the record producer related list on the Catalog Items.","Create a Flow Designer Action, with Variable Set Data Pill, then apply flow to all of the 80 catalog items.","Create an Order Guide, which includes all variables; then copy and hide variables as needed."],"a":[1]},{"n":141,"p":39,"q":"A task worker asks how they can monitor any updates occurring to records assigned to him, like responses from customers. What do you suggest?","o":["On My Work list, select the Activity Stream icon to show a frame with live updates","Click on the eyeglass icon to expand the Monitor frame","Open an Agent workspace tab for each record he wants to monitor","Select Service Desk > My Work Dashboard"],"a":[0]},{"n":142,"p":40,"q":"What access does a user need to be able to import articles to a knowledge base?","o":["sn_knowledge_import","sn_knowledge_contribute","Can contribute","Can import"],"a":[2]},{"n":143,"p":40,"q":"When importing data from a spreadsheet, which step defines where the incoming data columns will be written in the receiving table?","o":["Schedule Transform","Field Matching","Select Data Source","Create Transform Map","Load Data"],"a":[3]},{"n":144,"p":40,"q":"To apply a UI Policy to all views, which field should be set to true in its definition record?","o":["Global","Reverse if false","On load","Inherit"],"a":[0]},{"n":145,"p":40,"q":"What are the steps for importing data using an import set?","o":["Select source file; Run automap; Transform data; Clean up target table","Identity source; Import transform map; Run transformer, Verify import","Setup LDAP; Test map; Create update set; Run import; Apply update set","Load the data; Create transform map; Transform data; Clean up import table"],"a":[3]},{"n":146,"p":41,"q":"Which one of the following statements describes the contents of the Configuration Management Database (CMDB)?","o":["The CMDB contains data about tangible and intangible business assets","The CMDB contains the Business Rules that direct the intangible, configurable assets used by a company","The CMDB archives all Service Management PaaS equipment metadata and usage statistics","The CMDB contains ITIL process data pertaining to configuration items"],"a":[0]},{"n":147,"p":41,"q":"Which type of scripts run in the browser?","o":["Script Include Scripts","Access Control Scripts","Business Rule Scripts","UI Policies and Client Scripts"],"a":[3]},{"n":148,"p":41,"q":"Which modules can you use to create a new table? (Choose two.)","o":["Dictionary","Schema Map","Tables","Tables & Columns"],"a":[2,3]},{"n":149,"p":41,"q":"Which one of the following describes the primary operations performed against tables in the ServiceNow platform?","o":["Create, Read, Upload, Delete","Capture, Rate, Write, Develop","Create, Rate, Update, Delete","Create, Read, Write, Delete"],"a":[3]},{"n":150,"p":42,"q":"How is a user defined in ServiceNow?","o":["A user is a record stored in the Profile [sys_user_profile] table","A user is a record stored in the User [sys_user] table","A user is a record stored in the User Preference [sys_user_preference] table","A user is a field in the LDAP integration"],"a":[1]},{"n":151,"p":42,"q":"Which ServiceNow utility gives a Service Desk agent the ability to trace from a Service having an issue, to see which CIs supporting that service have active issues?","o":["CI Dependency View","Event Management Homepage","Service Dashboard","CI Health Dashboard"],"a":[0]},{"n":152,"p":42,"q":"Which feature enables business process owners to organize Flow Designer content into unified and digitized cross- enterprise processes via a digitized task board interface?","o":["Flow Designer","Workflow Editor","Process Workflow Designer","Process Automation Designer"],"a":[3]},{"n":153,"p":43,"q":"An IT user calls the service desk because they need to work on task records. All they can see is Self Service on their homepage when they login to the ServiceNow instance. What issue could explain this? (Choose two.)","o":["Their user account does not have itil role","Their user account was not approved by their manager","Their user account is not logged in properly","Their user account failed LDAP authentication","Their user account does not belong to any groups, which contain the itil role"],"a":[0,4]},{"n":154,"p":43,"q":"On a related list, which buttons are commonly used for managing the records on the list? (Choose three.)","o":["Add","Edit","Publish","Manage","New"],"a":[0,1,4]},{"n":155,"p":43,"q":"A customer requests the following data quality measures be added:\n• Incident numbers should be read only, on all lists and forms, for all users.\n• Short Description field should be mandatory, on all records, across all applications, on Insert. Which type of policy would you use to meet this requirement?","o":["Data Quality Policy","Dictionary Design Policy","Data Policy","Field Criteria Policy"],"a":[2]},{"n":156,"p":43,"q":"On what part of the ServiceNow instance, would you find the option to access applications, like Incident Management?","o":["Application Navigator","Service Desk Homepage","Self Service Module","Favorites"],"a":[0]},{"n":157,"p":44,"q":"In what order should filter elements be specified?","o":["Field, Operator, then Value","Field, Operator, then Condition","Operator, Condition, then Value","Value, Operator, then Field"],"a":[0]},{"n":158,"p":44,"q":"What catalog tool would you use to create a catalog item or record producer?","o":["Catalog Builder","Workflow Designer","Catalog Designer","Catalog Formatter"],"a":[0]},{"n":159,"p":44,"q":"On a form, which type of field has this icon which can be clicked, to see a preview of the associated record?","o":["Lookup","Preview","Reference","Snapshot","Quickview","Drilldown"],"a":[2],"img":[{"k":"p044_127.png","b":false}]},{"n":160,"p":45,"q":"While on an Incident record, how would you add a Tag for \"Special Handling\" to the record?","o":["Click on the Context menu, select Add Tag, type Special Handling, press enter","Click on the More options (...) icon, click Add Tag, type Special Handling, press enter","On the Tag field, select Special Handling from the choice list","On the Special Handling field, check the box"],"a":[1]},{"n":161,"p":45,"q":"What feature allows you to limit who is able to contribute or read knowledge within a knowledge base?","o":["Roles","Groups","User Criteria","Categories"],"a":[2]},{"n":162,"p":45,"q":"When moving a homepage or dashboard between instances, what must you remember?","o":["Manually add them to the update set","They cannot be moved via update set","They are automatically added to the update set","Create a separate update set for them"],"a":[0]},{"n":163,"p":45,"q":"What is the platform name for the Group table?","o":["sys_groups","group","sys_user_group","sys_group"],"a":[2]},{"n":164,"p":46,"q":"Many actions are included with flow designer, what are some frequently used core actions? (Choose four.)","o":["Look for Update","Create Record","Ask for Approval","Look Up Record","Wait for Condition","Wait for Match"],"a":[1,2,3,4]},{"n":165,"p":46,"q":"What role enables someone to authorize a request, with no other permissions on the platform?","o":["Approval Group [approval_group]","Authorize [authorize_user]","Reviewer [reviewer_user]","Verification [verify_user]","Approver [approver_user]"],"a":[4]},{"n":166,"p":46,"q":"On the knowledge base record, which tab would you use to define which users are not able to write articles to the knowledge base?","o":["Can Contribute","Cannot Author","Can Read","Can Write","Can Author"],"a":[2]},{"n":167,"p":47,"q":"What types of entities can receive task assignments, in ServiceNow? (Choose two.)","o":["Users","Departments","Groups","Teams"],"a":[0,2]},{"n":168,"p":47,"q":"Which statement is true about business rules?","o":["A business rule must run before a database action occurs","A business rule can be a piece of Javascript","A business rule must not run before a database action occurs","A business rule monitors fields on a form"],"a":[1]},{"n":169,"p":47,"q":"The Report Designer contains different sections for configuring your report. Which section is used to adjust the look of your report, including colors, titles and legend layout?","o":["Layout","Format","Configure","Style"],"a":[3]},{"n":170,"p":47,"q":"How would you distinguish between a Base Class table and a Parent Class table?","o":["Extended tables are always extended from Parent tables. Extended tables are usually extended from Base tables.","Extended tables can be extended from Parent tables or Base tables; but they cannot be extended from both.","Base Class tables always have tables extended from them. Parent tables do not have tables extended from them.","Base Class table is not extended from another table, Parent class tables may be extended from another table."],"a":[3]},{"n":171,"p":48,"q":"When a custom table is created, which access control rules are automatically created? (Choose four.)","o":["create","delete","execute","update","read","write"],"a":[0,1,4,5]},{"n":172,"p":48,"q":"Which banner icon do you use to change your personal system settings, like your instance color scheme?","o":["Magnifier","Question mark","Gear","Chat bubbles"],"a":[2]},{"n":173,"p":48,"q":"Which banner icon do you use to change your personal system settings, like your instance color scheme?","o":["Magnifier","Question mark","Gear","Chat bubbles"],"a":[2]},{"n":174,"p":48,"q":"When building an extended table from a base table, which fields do you need to create? (Choose two.)","o":["The fields that are not in the base table.","The mandatory fields for the base table.","The fields that are specific to the extended table.","The reference fields for the base table."],"a":[0,2]},{"n":175,"p":49,"q":"While showing a customer their Incident form, they ask to change the Priority field title to display their internal terminology PValue. How would you do that? (Choose two.)","o":["Right click on Priority and select Configure Label","Right click on Priority and select Configure Dictionary","Right click on Priority and select Configure Display Settings","Right click on Priority and select Configure Column"],"a":[0,1]},{"n":176,"p":49,"q":"As administrator, what must you do to access features of High Security Settings?","o":["Impersonate Security Admin","Select Elevate Roles","Add security_admin role to your user account","Use System Administration > Elevate Roles module"],"a":[1]},{"n":177,"p":49,"q":"What section on the notes tab, shows the history of the work documented on the record?","o":["Audit Log","Timeline","Journal","Diary","Activity"],"a":[4]},{"n":178,"p":49,"q":"How would you navigate to the Schema map for a table?","o":["System Definition > Tables; Select Table; Go to Related links and click Show Schema Map","System Dictionary > Show Schema Map; Select Table","System Definition > Show Schema Map; Select Table","System Definition > Dictionary; Select Table; Go to Related links and click Show Schema Map"],"a":[0]},{"n":179,"p":50,"q":"Which of the following are a type of client scripts supported in ServiceNow? (Choose four.)","o":["onSubmit","onUpdate","onCellEdit","onLoad","onEdit","onChange","onSave"],"a":[0,2,3,5]},{"n":180,"p":50,"q":"Which is the base table of the configuration management database hierarchy?","o":["cmdb_ci","cmdb","cmdb_rel_ci","ucmdb"],"a":[1]},{"n":181,"p":50,"q":"Which best describes a field in a ServiceNow table?","o":["A field is a table row.","A field is an item that appears in a menu list.","A field is a table cell that stores data.","A field is a record in a table."],"a":[2]},{"n":182,"p":50,"q":"What are examples of UI Actions relating to forms? (Choose three.)","o":["Form Columns","Form View","Form Buttons","Form Context Menu","Form Links"],"a":[2,3,4]},{"n":183,"p":51,"q":"Here is an example of the criteria set for a knowledge base:\n• Companies: ACME North America\n• Departments: HR\n• Groups: ACME Managers\n• Match All: Yes\nIn this example, what users would have access to this knowledge base?","o":["Members of the ACME Manager group, who are also members of HR Department and part of ACME North America","Employees of ACME North America, who are members of HR Department or the ACME Managers group","Users which are members of either ACME North America, or HR Department, or ACME Managers group","Members of the ACME Managers group, and HR department, regardless of geography"],"a":[0]},{"n":184,"p":51,"q":"In Flow Designer, where is the data from an action stored so it can be used in subsequent actions in the flow?","o":["Data Pill","Data Element","Data Trigger","Field Value","Field Icon"],"a":[0]},{"n":185,"p":51,"q":"A customer has asked for the following updates to a form:\n• Make Resolution code Mandatory, when state is changed to Resolved\n• Hide Major Incident check box, unless logged in user has Major Incident Manager role\nWhat type of rule(s) would you use to implement this requirement?","o":["Form Constraint","UI Design","Field Limiter","UI Policy","Dictionary Design"],"a":[3]},{"n":186,"p":52,"q":"What setting allows users to view a Knowledge Base article even if they are not logged in?","o":["The Public setting","The View All setting","The ESS role","The Allow All role"],"a":[0]},{"n":187,"p":52,"q":"When adding a related list to a form, you choose the related list from the list collector. What is an example of a related list you might see on the list collector? (Choose three.)","o":["Problem==Parent","HR Case->Parent","Catalog Task->Parent","Outage->Task number","Release Phase==Parent"],"a":[1,2,3]},{"n":188,"p":52,"q":"How is the ServiceNow platform set up so that Administrators can easily configure their instances to send an email at the end of an upgrade?","o":["Administrators can update the email notification named \"System Upgraded\" in the System Logs module by adding the appropriate User to receive it.","Administrators can update the email notification named \"System Upgraded\" in the Notifications module by adding the appropriate User to receive it.","Administrators can write a Client Script to send out an email to the Administrator when an Update is complete.","Administrators can write a Business Rule to send out an email to the Administrator when an Update is complete."],"a":[1]},{"n":189,"p":53,"q":"A customer wants to be able to identify and track components of their infrastructure that support their eCommerce service. What ServiceNow products could support this requirement? (Choose three.)","o":["Asset Management","Discovery","Configuration Management (CMDB)","Service Mapping","Performance Analytics"],"a":[1,2,3]},{"n":190,"p":53,"q":"Which type of tables may be extended by other tables, but do not extend another table?","o":["Base Tables","Core Tables","Extended Tables","Custom Tables"],"a":[0]},{"n":191,"p":53,"q":"For your implementation, the following tables are extended from each other:\n• Incident table is extended from Task table.\n• Super Incident table is extended from Incident table.\nIn this situation, which table(s) are Parent, Child and Base tables? (Choose five.)","o":[],"a":[]},{"n":192,"p":53,"q":"What capability allows users to create dashboards with widgets to visualize data over time in order to identify areas of improvement?","o":["Scheduled Reports","Performance Analytics","Analytics Reports","Reporting"],"a":[1]},{"n":193,"p":54,"q":"Which type of ServiceNow script runs on the web browser?","o":["Server script","Database script","Client script","Local script"],"a":[2]},{"n":194,"p":54,"q":"When selecting the Target table for an import, which tables can you select? (Choose three.)","o":["Tables outside of ServiceNow","Tables within the global scope","Related tables, using Dot Walk","Tables which allow write access to other applications","Tables within the existing application scope"],"a":[1,3,4]},{"n":195,"p":54,"q":"On Access Control Definitions, what are ways you can set the permissions on a Table? (Choose three.)","o":["Conditional Expressions","Roles","CRUD","Script that sets the answer variable to true or false","Groups"],"a":[0,1,3]},{"n":196,"p":55,"q":"What tool is used to import data from various data sources, and map that data into ServiceNow tables?","o":["Transform Set","Data Pack","Update Set","Import Set"],"a":[3]},{"n":197,"p":55,"q":"When you set a policy that is applied to all data entered into the platform (UI, Import Sets, or Web Services), where does this policy run by default?","o":["Client","Network","Browser","Server"],"a":[3]},{"n":198,"p":55,"q":"On what part of the ServiceNow instance, would you find the option to Impersonate User?","o":["User Menu","Content Fame","Application Navigator","Module"],"a":[0]},{"n":199,"p":55,"q":"How would you describe the relationship between the Incident and Task table?","o":["Incident table has a one to many relationship with the Task table","Incident table is extended from Task table","Incident table is related to the Task table via the INC number","Incident table has a many to many relationship with the Task table","Incident table is a database view of the Task table"],"a":[1]},{"n":200,"p":56,"q":"Which flow components allow you to specify when a flow should be run?","o":["Trigger and Condition Pill","Condition and Table","Trigger Criteria and Clock","Trigger and Condition","Scope and Trigger Condition"],"a":[3]},{"n":201,"p":56,"q":"Which of the following statement describes the purpose of an Order Guide?","o":["Order Guides restrict the number of items in an order to only one item per request","Order Guide provide a list of guidelines for Administrators on how to set up item variables","Order Guide provide the ability to order multiple, related items as one request","Order Guides take the user directly to the checkout without prompting for information"],"a":[2]},{"n":202,"p":56,"q":"Which feature helps to automatically allocate a critical, high-priority, service request to the appropriate assignment group or team member?","o":["Assignment Rule","User Policy","Predictive Intelligence","UI Policy"],"a":[0]},{"n":203,"p":56,"q":"The Report Designer contains different sections for configuring your report. Which section is used to specify the name of the report, and the table or data source for the report?","o":["Type","Properties","Configure","Sources","Data"],"a":[4]},{"n":204,"p":57,"q":"You are editing a new incident record and would like the \"Save\" button to be located on the Form header. Which action would need to be taken for that button to appear?","o":["Context Menu > Form Design > add the “Save” button.","All > System Properties > UI Properties > Turn on the “glide.ui.advanced” property.","All > System Properties > UI Properties > Turn on the “Save” button.","Context Meru > Form Layout > add the “Save” button."],"a":[2],"img":[{"k":"p057_154.png","b":true}]},{"n":205,"p":57,"q":"Which features ensures data consistency while importing data using import sets and web services?","o":["UI Policy","Data Policy","Business Rule","Client Script","CSDM"],"a":[1]},{"n":206,"p":57,"q":"When using Flow Designer, what is the Flow Execution initiated by?","o":["A flow logic","An existing subflow","An execution data pill","A trigger"],"a":[3]},{"n":207,"p":58,"q":"What is the name of the string that displays filter criteria?","o":["Breadcrumb","Choice","Menu","Topic"],"a":[0]},{"n":208,"p":58,"q":"Which system property is added and set to true in order to see impersonation events in the System Log?","o":["glide.sys.all_impersonation","glide.user_setting","glide.impersonation_setting","glide.sys.log_impersonation","glide.sys.admin_login"],"a":[3]},{"n":209,"p":58,"q":"What process allows users to create, categorize, review, approve and browse important information in a centralized location that is shared by the entire organization?","o":["Self Service Management","Knowledge Management","Business Information Management","Information Portal Management","Knowledge-Centered Management"],"a":[1]},{"n":210,"p":58,"q":"A colleague wants to rearrange the columns on their My Work List. Once the user has navigated to the list, where should they navigate to select and arrange the columns?","o":["Right click on any column header, Context Menu > Configure > List Layout","Click List Context Menu > Configure > List Layout","Click List Context Menu > Personalize List","Click Personalize List"],"a":[3]},{"n":211,"p":59,"q":"You are looking at a list of Active Incidents. You want to exclude Incidents with the state of Resolved. How might you do that?","o":["On Search, select State, type not Resolved, press enter","On State column title, right-click, select Filter Out > Resolved","On the list of records, locate and right-click on the Resolved value, select Filter Out","On the list of records, locate and right-click on the Resolved value, select Exclude","Click Funnel icon, click AND, Select Resolved, is Not, State, click Run"],"a":[2]},{"n":212,"p":59,"q":"Which tool is used to have conversations with logged-in users in real-time?","o":["Connect Chat","Now Messenger","User Presence","Comments"],"a":[0]},{"n":213,"p":59,"q":"Roles can inherit permissions from other roles. Which role inherits all of the permissions of the catalog role, and the user_criteria_admin role, plus has permissions to create Items and Services?","o":["Sys Admin [sys_admin]","Catalog Admin [catalog_admin]","Catalog Author [sn_catalog_write]","Item Admin [sn_item_admin]"],"a":[1]},{"n":214,"p":59,"q":"What component of the ServiceNow infrastructure defines every table and field in the system?","o":["Schema","Field Map","Table Class Manager","Dictionary","Data Atlas"],"a":[3]},{"n":215,"p":60,"q":"Which data consistency settings can be achieved using UI Policy? (Choose three.)","o":["Setting fields to accept the data in an expected format","Setting fields to accept the data with ‘n’ number of characters","Setting fields hidden","Settings fields read-only","Setting fields mandatory"],"a":[2,3,4]},{"n":216,"p":60,"q":"A customer wants to use a client script to validate things on a form in order to make sure the submission makes sense. What type of client script would you recommend to meet this requirement?","o":["onSubmit()","onSubmission()","onUpdate()","onLoad()"],"a":[0]},{"n":217,"p":60,"q":"An order from the Service Catalog has been placed. Two records in the Platform are created as a result. Which two records are associated with this newly ordered item? (Choose two.)","o":["A record of sc_req_item table","A record of sc_task","An incident record","A change record","A problem record"],"a":[0,1],"img":[{"k":"p060_161.png","b":true}]},{"n":218,"p":61,"q":"What action will allow you to personalize layouts of columns in a list?","o":["Context Menu > View > Personalize","Click Gear Icon > Personalize window options > Select the appropriate columns","Select the column to be personalized and right at the header > Choose the options to personalize","Select the column to be personalized > Click Edit icon (Pencil) > Choose the options to personalize"],"a":[1]},{"n":219,"p":61,"q":"An order for new office equipment has been placed through the Service Catalog. How would you view the lists of requests after the orders have been placed?","o":["All > Tables and Columns > Tasks","In the Navigation Filter, type “requests.list\" and press the Enter key","All > Service Catalog > Requests","All > Service Catalog > Open Records > Items"],"a":[3]},{"n":220,"p":61,"q":"Which path would you take to access the table configuration page from a form?","o":["The Form Context menu > View > Show Table","The Form Context menu > View > Table","The Form Context menu > Configure > Dictionary","The Form Context menu > Configure > Table"],"a":[3],"img":[{"k":"p061_164.png","b":true}]},{"n":221,"p":62,"q":"Which admin role is required to make changes to High Security Settings?","o":["high_sec_admin","sn_acl_admin","admin","security_admin"],"a":[3]},{"n":222,"p":62,"q":"What is the most common role that has access to almost all platform features, functions, and data?","o":["Super User [sn_super_user]","Security Admin [securty_admin]","System Administrator [admin]","Base Admin [base_admin]","System Manager [sys_manager]"],"a":[2]},{"n":223,"p":62,"q":"As it relates to ServiceNow reporting, which of the following statements describes what a metric can do?","o":["A metric is a report gauge used on homepages to display real-time data","A metric is a time measurement used to report the effectiveness of workflows and SLAs","A metric is used to measure and evaluate the effectiveness of IT service management processes","A metric is a comparative measurement used to report the effectiveness of flows and SLAs."],"a":[2]},{"n":224,"p":62,"q":"Which of the following concepts are associated with the ServiceNow CMDB? (Choose four.)","o":["Service Processes","User Permissions","Tables and Fields","A Database","The Dependency View"],"a":[0,2,3,4]},{"n":225,"p":63,"q":"When moving multiple update sets at one time, what might you do to facilitate the move?","o":["Preview","Batch","List","Map"],"a":[1]},{"n":226,"p":63,"q":"What do you click when you have made modifications to your report, and you want to see the results without saving?","o":["Preview","Test","Run","Try It","Execute"],"a":[2]},{"n":227,"p":63,"q":"Which framework can automatically populate values for the Priority and Category fields based on the Short description field value?","o":["Predictive Intelligence","Assignment Rule","CSDM","Action","UI Policy"],"a":[0]},{"n":228,"p":64,"q":"Which testing framework is used to test ServiceNow Applications?","o":["Test Driven Framework (TDF)","Junit","Selenium","Automated Test Framework (ATF)"],"a":[3]},{"n":229,"p":64,"q":"Which allows the creation of a task-based record from Service Catalog?","o":["Assignment Rule","Flow Designer","UI Builder","Record Producers"],"a":[3]},{"n":230,"p":64,"q":"What module do you use to access the reports that are available to you?","o":["Self-Service > My Reports","Self-Service > My Dashboards","Reports > View / Run","Reports > Homepage","Reports > Overview"],"a":[2]},{"n":231,"p":64,"q":"Security rules are defined to restrict the permissions of users from viewing and interacting with data. What are these security rules called?","o":["CRUD Rules","Access Control Rules","Role Assignment Rules","Scripted User Rules","User Authentication Rules"],"a":[1]},{"n":232,"p":65,"q":"A new employee joins the IT department and needs to perform work assigned to Network and Hardware groups. How would you set up their access? (Choose three.)","o":["Add User Account to Hardware group","Add User Account to IT Knowledgebase","Create User Account","Add User Account to itil group","Add User Account to Network group","Add User Account to ACL"],"a":[0,2,4]},{"n":233,"p":65,"q":"The customer has asked that you change the default layout of the Task list. They would like these columns, in this order:\n• Number\n• Task Type\n• Parent\n• Short Description\n• Assignment Group\n• Assignee\n• Updated\nAfter navigating to the list, where would you click, to meet this requirement?","o":["Click List Context Menu > Personalize List","Click List Context Menu > Configure > Columns","Right click List Gear icon > Configure > Columns","Right click on any column header, Context Menu > Configure > List Layout"],"a":[3]},{"n":234,"p":65,"q":"Which ServiceNow capability allows you to provide knowledge articles, via a conversational messaging interface?","o":["Agent Assist","Virtual Agent","Now Messenger","Instance Chat"],"a":[1]},{"n":235,"p":66,"q":"What is a formatter? Select one of the following.","o":["A formatter allows you to configure applications on your instance","A formatter is a form element used to display information that is not a field in the record","A formatter allows you to populate fields automatically","A formatter is a set of conditions applied to a table to help find and work with data"],"a":[1]},{"n":236,"p":66,"q":"On the Form header, which element you to access form templates?","o":["Stamp","More Options (...)","Pages","Paperclip"],"a":[1]},{"n":237,"p":66,"q":"What is the definition of a group?","o":["A collection of subject matter experts","A department","An escalation pod","A collection of users","A collection of tasks"],"a":[3]},{"n":238,"p":66,"q":"Which ServiceNow utility provides a modern interactive graphical interface to visualize configuration items and their relationships?","o":["Flow Design","CI Class Map","Dependency View","Business Service Map"],"a":[2]},{"n":239,"p":67,"q":"What icon do you use to change the label on a Favorite?","o":["Star","Clock","Triangle","Pencil"],"a":[3]},{"n":240,"p":67,"q":"Which tool is used to define relationships between fields in an import set table and a target table?","o":["Schema Map","Field Transformer","Transform Map","Transform Schema"],"a":[2]},{"n":241,"p":67,"q":"When moving a homepage or dashboard between instances, what must you remember?","o":["Download both as PDF and XML files","They cannot be moved via update set","The Platform will automatically add them to the update set","Manually add them to the update set"],"a":[3]},{"n":242,"p":67,"q":"Which allows the creation of a task-based record from Service Catalog?","o":["Record Producers","UI Builder","Assignment Rule","UI Actions","Flow Designer"],"a":[0]},{"n":243,"p":68,"q":"On the knowledge base record, which tab would you use to define which users are able to write articles to the knowledge base?","o":["Can Contribute","Cannot Author","Can Read","Can Write","Can Author"],"a":[0]},{"n":244,"p":68,"q":"Which type of scripts run in the browser?","o":["UI Policies","Script Include Scripts","Access Control Scripts","Business Rule Scripts"],"a":[0]},{"n":245,"p":68,"q":"What enables you to trace the connection from an infrastructure item, like a Server, to the Services that are dependent on that Server?","o":["Automapping Utility","Relationships","Service Tracer","Transform Map"],"a":[1]},{"n":246,"p":69,"q":"When searching using the App Navigator search field, what can be returned? (Choose four.)","o":["Names of Applications and Modules","Names of Modules","Names of Applications","Favorites","History Records","Titles of Dashboard Gauges"],"a":[0,1,2,3]},{"n":247,"p":69,"q":"What section on a task record is used to see the most recent updates made to a record?","o":["Timeline","Related List","Activity Stream","Audit Log"],"a":[2]},{"n":248,"p":69,"q":"While using the CMDB, what do you call the component that needs to be managed in order to deliver services?","o":["Configuration Item","Asset","Catalog Items","Data Plow","Service Offerings"],"a":[0]},{"n":249,"p":69,"q":"What is the first step in the process to import spreadsheet data into ServiceNow?","o":["Select Import Set","Run Data Scrubber","Define Data Source","Create import Set","Set Coalesce"],"a":[3]},{"n":250,"p":70,"q":"What are the steps for importing data using an import set?","o":["Create Import Set; Create transform map; Transform data; Clean up import table","Create a Transform Map, Load Data, Transform Data, Run Transform Map Script","Identify source; Import transform map; Run transformer; Verify import","Select source file; Run AutoMap; Transform data; Clean up target table"],"a":[0]},{"n":251,"p":70,"q":"If users would like to locate and assign a task to themselves in the Platform, what action could they perform from the list view to make the assignment? (Choose two.)","o":["Select the record using the check box, then select the Person icon","Select the record using the check box then select the Assign To Me UI action on the List Header","Double click on the Assigned to value, type the name of the user, and select the green check","Right click on the Task number and select the Assign to me option in the menu","Select the Task number, and select the Assign to me UI action on the form"],"a":[2,3]},{"n":252,"p":70,"q":"What module enables an administrator to define destinations for imported data on any ServiceNow table?","o":["Load Data","Field Transform","Schema Map","Transform Map"],"a":[3]},{"n":253,"p":70,"q":"Which ServiceNow capability provides assistance to help users obtain information, make decisions, and perform common work tasks via a messaging interface?","o":["Now Support","ServiceNow Messenger","Agent Workspace","Virtual Agent","Knowledge Chat"],"a":[3]},{"n":254,"p":71,"q":"What instance resource allows you to access guided tours, information about actions, and instructions on how to use inputs and outputs in your flow?","o":["Now Support","Community","Docs","Help Panel (question mark icon)"],"a":[3]},{"n":255,"p":71,"q":"When importing data from a spreadsheet, which step defines where the incoming data columns will be written in the receiving table?","o":["Select Data Source","Schedule Transform","Load Data","Create Transform Map","Field Alignment"],"a":[3]},{"n":256,"p":71,"q":"On a form header, what icon would you click to access Template features?","o":["Context Menu","Paper clip","Stamp","More options (...)"],"a":[3]},{"n":257,"p":71,"q":"Which technique is used to get information from a series of referenced fields from different tables?","o":["Table-Walking","Sys_ID Pulling","Dot-Walking","Record-Hopping"],"a":[2]},{"n":258,"p":72,"q":"Access Control rules are applied to a specific table, like the Incident table. What is the object name for a rule that applies to the entire Incident table (all rows and fields)?","o":["incident.*","incident.all","incident.!","incident.None"],"a":[3]},{"n":259,"p":72,"q":"On a list, what does each row show?","o":["A filter","A record","A table","A field"],"a":[1]},{"n":260,"p":72,"q":"Which action enables personalization in a form for the admin role, only?","o":["Navigate to sys_form_properties.list and set the property glide.ui.enable_personalize_form.admin to true.","Navigate to Context Menu > Configure > Form Layout and select ‘Enable Personalization’ and Enter the ‘admin’ role.","Navigate to Context Menu > Configure > Table and add the role ‘Admin’ in the ‘Available User’ list box.","Navigate to sys_properties.list find the property glide.ui.personalize_form.role and set the Value to admin."],"a":[3]},{"n":261,"p":73,"q":"Which element is used to track items not saved with a field, in a record?","o":["Sidebar","List Editor","Activity formatter","Dictionary"],"a":[2]},{"n":262,"p":73,"q":"What does ServiceNow recommend as a best practice regarding data imports?","o":["Adjust your Transform maps, after the data is loaded into the target table.","Use extremely large Import Sets, instead of multiple large Import Sets.","Create a new Import set table for each new data load.","Plan time before your import to remove obsolete or inaccurate data.","Monitor data quality and clean imported data, using the Data Scrub Workspace."],"a":[3]},{"n":263,"p":73,"q":"When an administrator sets a policy that is applied to all data entered into the Platform (UI, Import Sets, or Web Services), where does this policy run by default?","o":["Network","Server","Client","Browser"],"a":[1]},{"n":264,"p":73,"q":"If a user is on an Incident form and is alerted when they change the value of the Priority field, which type of script executes in the Platform?","o":["A server script","A client script","A fix script","A business rule"],"a":[1]},{"n":265,"p":74,"q":"Which feature can be used to categorize a set of records from a list and make them visible to other users?","o":["Tags","History","Favorites","Activity Formatter"],"a":[0]},{"n":266,"p":74,"q":"The testing team needs to be able to perform activities in the test instance, as though they are a member of the Service Desk group. What role would they need to be able to switch between user accounts, without logging out and back in?","o":["service_desk","impersonator","admin","incognito"],"a":[1]},{"n":267,"p":74,"q":"What are the benefits of building flows using Flow Designer? (Choose three.)","o":["Provides IDE for complicated scripting","Provides built-in libraries /API for complex coding","Automatically populates SLA records","Provides natural-language descriptions of flow logic","Supports No-Code application development","Supports easy integration with 3rd party systems"],"a":[3,4,5]},{"n":268,"p":74,"q":"What is a schema map?","o":["A schema map enables administrators to define records from specific tables as trouble sources for Configuration Items","A schema map graphically organizes the visual task boards for the CMDB","A schema map graphically displays the Configuration Items that support a business service","A schema map displays the details of tables and their relationships in a visual manner, allowing administrators to view and easily access different parts of the database schema"],"a":[3]},{"n":269,"p":75,"q":"Which helps to visualize configuration items and their relationships?","o":["Tables","Schema Map","Flow Design","Transform Map","Dependency View"],"a":[4]},{"n":270,"p":75,"q":"Which tables are children of the Task table and come with the base system? (Choose three.)","o":["Config","Problem","Dictionary","cmdb","Incident","Change Request"],"a":[1,4,5]},{"n":271,"p":75,"q":"Which role(s) are required to impersonate a user? (Choose two.)","o":["security_admin","sys_admin","impersonator","sys_user","admin"],"a":[2,4]},{"n":272,"p":75,"q":"Which set of steps is used to import spreadsheet data into a ServiceNow table?","o":["Select Data Source, Schedule Transform","Load Data, Create Transform Map, Run Transform","Define Data Source, Select Transform Map, Run Transform","Select Import Set, Select Transform Map, Run Transform"],"a":[1]},{"n":273,"p":76,"q":"What contains the configuration changes made in an instance (i.e. changes in a form) and helps to implement the changes from the Dev environment to another environment?","o":["Transform maps","Update sets","Import sets","System dictionaries"],"a":[1]},{"n":274,"p":76,"q":"An administrator creates “customer_table_admin” and “customer_table_user” roles for the newly created \"Customer Table”. Which ACL rule would grant access to all rows and all fields to both the customer_table_admin and customer_table_user roles?","o":["customer.none","customer.all","customer.field","customer.*"],"a":[0]},{"n":275,"p":76,"q":"Which tables are available by default in a ServiceNow instance? (Choose three.)","o":["User","Issue","Incident","Project","Task","Item"],"a":[0,2,4]},{"n":276,"p":77,"q":"In a Knowledge Base record, where can an administrator find the User Criteria for who can read the articles?","o":["From the Accessible to tab","From the Available to tab","From the Can Access tab","From the Can Read tab"],"a":[3]},{"n":277,"p":77,"q":"What action helps to see which modules are visible to a user?","o":["Install the Bomgar plug-in","Initiate a Connect Chat session","Launch a NowChat window","Impersonate the user"],"a":[3]},{"n":278,"p":77,"q":"What are the different Notification methods that can be used to alert users when events that concern them have occurred? (Choose three.)","o":["Meeting Invitation","Email","Browser Pop ups","Messenger","SMS"],"a":[0,1,4]},{"n":279,"p":77,"q":"Which one of the following statements best describes the purpose of an Update Set?","o":["An Update Set allows administrators to group a series of changes into a named set and then move this set as a unit to other systems","By default, an Update Set includes customizations, Business Rules, and homepages","An Update Set is a group of customizations that is moved from Production to Development","By default, the changes included in an Update Set are visible only in the instance to which they are applied"],"a":[0]},{"n":280,"p":78,"q":"What are the steps to apply an update set retrieved from another instance?","o":["Load the Update Set > Import the Update Set > Install","Verity Update Set is Complete, Retrieve, Preview, Commit","Verify Update Set is Complete, Test Connection, Apply","Import the Update Set > Verify the Update Set is complete > Link the Update Set > Publish"],"a":[1]},{"n":281,"p":78,"q":"After finishing your work on High Security Settings, what is a possible way to return to normal admin security levels?","o":["Select Global Update Set","Log out and back in","End Impersonation","Select Normal role","Use System Administration > Normal Security module"],"a":[1]},{"n":282,"p":78,"q":"Which feature can be used to give users the choice to easily populate the most-used fields for a specific table?","o":["Tags","Formatter","Template","Reference type fields"],"a":[2]},{"n":283,"p":78,"q":"What protects applications by restricting access to data in another application, in the same instance?","o":["Admin Center","Access Control Rules","Assignment Rules","Application Scope"],"a":[3]},{"n":284,"p":79,"q":"Which module in the Service Catalog application is used to create a new catalog item?","o":["Configuration Items","Maintain Items","Content Items","Catalog Items"],"a":[1]},{"n":285,"p":79,"q":"What helps to define the structure of a catalog item form that is displayed to the customer?","o":["Variables","Catalog Description","Catalog Definition","Order Guides"],"a":[0]},{"n":286,"p":79,"q":"Which displays the list of activities, or history, on a form?","o":["Formatter","Dictionary","Sidebar","History Menu"],"a":[0]},{"n":287,"p":79,"q":"Where should an administrator navigate to add the \"Save\" button in the form header?","o":["Context Menu > Form Design","All > System Properties > UI Action Settings","All > System Properties > UI Properties","Context Menu > Form Layout"],"a":[2]},{"n":288,"p":80,"q":"What are the options that can be set to determine when a Business Rule executes? (Choose four.)","o":["Async","Load","Change","Display","After","Before","Submit","Click"],"a":[0,3,4,5]},{"n":289,"p":80,"q":"Which of the following can be customized through the Basic Configuration UI 16 module? (Choose three.)","o":["Banner Image","Record Number Format","Browser Tab Title","System Date Format","Form Header Size"],"a":[0,2,3]},{"n":290,"p":80,"q":"Which access control rule applies to every field in the incident table?","o":["incident<=>*","incident.all","incident.*","incident||*"],"a":[2]},{"n":291,"p":80,"q":"What is the purpose of an application scope?","o":["Scope determines which parts of an application are available for use by other applications In ServiceNow","Scope prevents applications from changing their own tables and business logic","Scope determines the functionality of core services in the platform","Scope determines all applications access each other's tables and business logic"],"a":[0]},{"n":292,"p":81,"q":"On a Catalog Task record, how would an administrator change the priority choice options?","o":["In the Context menu of the form, select Configure Options","Right-click the Priority Label > select Configure Lists","Right-click the Priority Label > select Configure Choices","Open the Data Dictionary > select Values"],"a":[2]},{"n":293,"p":81,"q":"Which sequence of actions applies an update set to an instance?","o":["Preview, Save, Commit","Preview, Retrieve, Commit","Retrieve, Commit, Preview","Retrieve, Preview, Commit"],"a":[3]},{"n":294,"p":81,"q":"A customer asks you to make the following updates to a form:\n1. When Caller field is populated, automatically look up caller location and load it in the Location field. 2. Add notice at the top of the page when the record is submitted.\nWhat type of script would you use to meet this requirement?","o":["UI script","Server script","JavaScript","Client script"],"a":[3]},{"n":295,"p":82,"q":"Where do Ul Policies run?","o":["Client-side (browser)","Knowledge Base","Server-side (database)","Within server-side scripts"],"a":[0]},{"n":296,"p":82,"q":"You are creating a catalog item for ordering a new desktop computer. The computers have these options: Color: Black or Silver -\nRAM: 32 MB or 64MB -\nKeyboard: Standard or Ergonomic -\nMonitor: 24 inch or 32 inch -\nHow would you add these options to the catalog item form?","o":["Add choices","Add variables","Add UI options","Add fields"],"a":[1]},{"n":297,"p":82,"q":"Which form element displays the list of activities, or history, on a task form?","o":["Action Formatter","Activity Formatter","Action Stream","Sidebar"],"a":[1]},{"n":298,"p":83,"q":"What is the function of user impersonation?","o":["Testing and visibility","Activate verbose logging","View custom perspectives","Unlock Application master list"],"a":[0]},{"n":299,"p":83,"q":"Your customer wants to update a notification so it is sent to the Caller's Manager.\nWhich action supports this requirement?","o":["On the 'Who will receive' tab on the Notification record add the Caller field, then dot walk to the Caller's Manager field to add it.","On the Notification record create a flow and include a notification in the flow for \"All receivers\".","On the 'Send to' tab on the Notification record, add the Caller field, then dot walk to the Caller’s Manager field to add it.","On the 'Send to' tab on the Notification record, set \"Who will receive\" to Subscribable."],"a":[0]},{"n":300,"p":83,"q":"Which action enables a user to view and specify date and time formats in their instance?","o":["Select the User menu > Preferences > Time Settings > Toggle display time zone","Ask the user to adjust the time zone on their personal computer","Use the system properties to correct the instance's time zone","Select the User menu > Preferences > Language & Region > Set date and time format and time zone","Create a UI Script to set the default timezone"],"a":[2]},{"n":301,"p":83,"q":"A manager is complaining that they can't get the data they need on a report, because the data resides in two different tables. This data is used for many different reports in their department. You have checked to see if dot- walking will meet the requirement, and it is not possible. What else might you try to help this manager?","o":["Export the tables to spreadsheet","Create a Database View","Create a Report Template","Create a Report Source","Create a custom table"],"a":[1]},{"n":302,"p":84,"q":"What information does the System Dictionary contain?","o":["The human-readable labels and language settings","The definition for each table and column","The information on how tables relate to each other","The language dictionary used for spell checking"],"a":[1]},{"n":303,"p":84,"q":"Which storefront is a single location for accessing pre-built spokes, to quickly integrate with third party services to build and share content?","o":["ServiceNow Store","Integration Spoke Store","Spoke Store","ServiceNow Spoke Store"],"a":[0]},{"n":304,"p":84,"q":"Which actions would you take to edit the title on an application menu? (Choose two.)","o":["Select the Application name on the Navigator, then select the pencil icon","Select System Definition > Dictionary > Application","Select System Definitions > Application Menus then select the application","Select Configuration > Applications, then select the application","Select the form for the Application, then right-click, Configure > Form Designer"],"a":[2,3]},{"n":305,"p":84,"q":"When working on a form, what is the difference between Insert and Update operations?","o":["Insert creates a new record and Update saves changes, both remain on the form","Insert creates a new record and Update saves changes, both exit the form","Insert saves changes and exits the form, Update saves changes and remains on the form","Insert saves changes and remains on the form, Update saves changes and exits the form"],"a":[1]},{"n":306,"p":85,"q":"The display sequence is controlled in a Service Catalog Item using which of the following?","o":["The Default Value field in the Catalog Item form","The Sequence field in the Catalog Item form","The Order field in the Variable form","The Choice field in the Variable form"],"a":[2]},{"n":307,"p":85,"q":"How is the Event Log different from the Event Registry?","o":["Event Log contains generated Events, the Event Registry is a table of Event definitions","Event Log is formatted in the Log style, the Event Registry displays different fields","Event Log lists Events that were triggered by integrations, the Event Registry lists the Events that were triggered during the day (24-hour period)","Event Log is the same as the Event Registry"],"a":[0]},{"n":308,"p":85,"q":"What is a Dictionary Override?","o":["A Dictionary Override is an incoming customer update in an Update Set which applies to the same objects as a newer local customer update","A Dictionary Override is the addition, modification, or removal of anything that could have an effect on IT services","A Dictionary Override is a task within a flow that requests an action before the flow can continue","A Dictionary Override sets field properties in extended tables"],"a":[3]},{"n":309,"p":85,"q":"Which group of permissions is used to control Application and Module access?","o":["Access Control Rules","UI Policies","Roles","Assignment Rules"],"a":[2]},{"n":310,"p":86,"q":"What is a Record Producer?","o":["A Record Producer is a type of Catalog Item that is used for Requests, not Services","A Record Producer creates user records","A Record Producer is a type of Catalog Item that provides easy ordering by bundling requests","A Record Producer is a type of a Catalog Item that allows users to create task-based records from the Service Catalog"],"a":[3]},{"n":311,"p":86,"q":"Create Incident, Password Reset, and Report outage: what do these services in the Service Catalog have in common?","o":["They direct the user to a record producer","They direct the user to a catalog property","They direct the user to a catalog UI policy","They direct the user to a catalog client script"],"a":[0]},{"n":312,"p":86,"q":"What is the Import Set Table?","o":["A table where data will be placed, post-transformation","A table that determines relationships","A staging area for imported records","A repository for Update Set information"],"a":[2]},{"n":313,"p":86,"q":"What is a characteristic of importing data into ServiceNow?","o":["An existing Transform Map can be used one time on the same import set","Coalesce fields are used only after running Transform","Any user can manage and set up import sets","An existing Transform Map can be used multiple times on the same import set"],"a":[3]},{"n":314,"p":87,"q":"What module in the Service Catalog application does an Administrator access to begin creating a new item?","o":["Maintain Categories","Maintain Items","Content Items","Items"],"a":[1]},{"n":315,"p":87,"q":"Which of the following allows a user to edit field values in a list without opening the form?","o":["Data Editor","Edit Menu","List Editor","Form Designer"],"a":[2]},{"n":316,"p":87,"q":"Which three Variable Types can be added to a Service Catalog Item?","o":["True/False, Multiple Choice, and Ordered","True/False, Checkbox, and Number List","Number List, Single Line Text, and Reference","Multiple Choice, Select Box, and Checkbox"],"a":[3]},{"n":317,"p":87,"q":"Reports can be created from which different places in the platform? (Choose two.)","o":["List column heading","Metrics module","Statistics module","View / Run module"],"a":[0,3]},{"n":318,"p":88,"q":"How are Workflows moved between instances?","o":["Workflows are moved using Update Sets","Workflows are moved using Transform Maps","Workflows are moved using Application Sets","Workflows cannot be moved between instances"],"a":[0]},{"n":319,"p":88,"q":"The baseline Service Catalog homepage contains links to which of the following components?","o":["Record Producers, Order Guides, and Catalog Items","Order Guides, Item Variables, and flows","Order Guides, Catalog Items, and flows","Record Producers, Order Guides, and Item Variables"],"a":[0]},{"n":320,"p":88,"q":"Which of the following statements is true when a new table is created by extending another table?","o":["The new table archives the parent table and assumed its roles in the database","The new table inherits all of the Business Rules, Client Scripts, and UI Policies of the parent table, but none of the existing fields","The new table inherits all of the fields of the parent table and can also contain new fields unique to itself","The new table inherits all of the fields, but does not inherit Access Control rules, Client Scripts, and UI Policies of the parent table"],"a":[2]},{"n":321,"p":89,"q":"Where can Admins check which release is running on an ServiceNow instance?","o":["Memory Stats module","Stats module","System.upgraded table","Transactions log"],"a":[1]},{"n":322,"p":89,"q":"A knowledge article must be which of the following states to display to a user?","o":["Published","Drafted","Retired","Reviewed"],"a":[0]},{"n":323,"p":89,"q":"What is the name of the conversational bot platform that provides assistance to help users obtain information, make decisions, and perform common tasks?","o":["Answer Agent","live Feed","Virtual Agent","Connect Chat"],"a":[2]},{"n":324,"p":89,"q":"What is the purpose of a Related List?","o":["To create a one-to-many relationship","To dot-walk to a core table","To present related fields","To present related records"],"a":[3]},{"n":325,"p":90,"q":"Which one of the following statements describes the purpose of a Service Catalog flow?","o":["A Service Catalog flow generates three basic components: item variable types, tasks, and approvals","Although a Service Catalog flow cannot send notifications, the flow drives complex fulfillment processes","A Service Catalog flow is used to drive complex fulfillment processes and sends notifications to defined users or groups","A Service Catalog flow generates three basic components: item variable types, tasks, and notifications"],"a":[2]},{"n":326,"p":90,"q":"Which term best describes something that is created, has worked performed upon it, and is eventually moved to a state of closed?","o":["report","flow","event","task"],"a":[3]},{"n":327,"p":90,"q":"Which are valid Service Now User Authentication Methods? (Choose three.)","o":["XML feed","Local database","LDAP","SSO","FTP authentication"],"a":[1,2,3]},{"n":328,"p":90,"q":"Knowledge Base Search results can be sorted by which of the following? (Choose three.)","o":["Most recent update","Popularity","Relevancy","Manager assignment","Number of views"],"a":[0,2,4]},{"n":329,"p":91,"q":"Access Control rules may be defined with which of the following permission requirements? (Choose three.)","o":["Roles","Conditional Expressions","Assignment Rules","Scripts","User Criteria","Groups"],"a":[0,1,3]},{"n":330,"p":91,"q":"Which section of the ServiceNow UI allows you to perform a global search?","o":["Application Navigator","Banner frame","List pane","Content frame"],"a":[1]},{"n":331,"p":91,"q":"How do you make a list filter available to everyone?","o":["Make active, assign a name, and save","Assign a group, set visibility, and save","Assign a name, set visibility, and save","Make active, set visibility, and save"],"a":[2]},{"n":332,"p":91,"q":"What would NOT appear in the Application Navigator if `service` is typed into the filter field?","o":["Configuration > Business Services","Self-Service > Knowledge","Service Portal > Widgets","Incident > Assigned to me"],"a":[3]},{"n":333,"p":92,"q":"Which of the following is used to categorize, flag, and locate records?","o":["Search","Favorites","Tags","Bookmarks"],"a":[2]},{"n":334,"p":92,"q":"Which tool should be used to populate commonly used fields in a form?","o":["Template","Reference Qualifier","Formatter","Assignment Rule"],"a":[0]},{"n":335,"p":92,"q":"How is a group defined in ServiceNow?","o":["A group is one record stored in the Group Type [sys_user_group_type] table","A group is one record stored in the Group [sys_user_group] table","A group defines a set of users that share the same location","A group defines a set of users that share the same job title"],"a":[1]},{"n":336,"p":92,"q":"What is a role in ServiceNow?","o":["A role is one record in the Role [user_sys_role] table","A role is a set of modules for a particular application","A role is one record in the Role [sys_user_role] table","A role is a persona used in Live Feed Chat"],"a":[2]},{"n":337,"p":93,"q":"What is a Notification?","o":["A new Knowledge article created by a Business Rule","A tool for alerting users that events that concern them have occurred","A message through Connect related to a Change Request","An email file attachment"],"a":[1]},{"n":338,"p":93,"q":"Which one of the following is NOT a type of Visual Task Board?","o":["Flexible","Freeform","Feature","Guided boards"],"a":[2]},{"n":339,"p":93,"q":"What is the path an Administrator could take to view the fulfillment stage task list for an order placed by a user?","o":["RITM (Number)>REQ (Number)>PROCUREMENT (Number)","REQ (Number)>RITM (Number)>PROCUREMENT (Number)","REQ (Number)>RITM (Number)>TASK (Number)","FULFILLMENT (Number)>RITM (Number)>TASK (Number)"],"a":[2]},{"n":340,"p":93,"q":"What is (are) best practice(s) regarding users/groups/roles? (Choose two.)","o":["You should never assign roles to groups.","You should assign roles to users.","You should add users to groups.","You should assign roles to groups."],"a":[2,3]},{"n":341,"p":94,"q":"What are two ways to generate an Event? (Choose two.)","o":["Business Rule","Workflow","Log entry","Knowledge article publication"],"a":[0,1]},{"n":342,"p":94,"q":"Which core table in the ServiceNow platform provides a series of standard fields used on each of the tables that extend it, such as the Incident [incident] and\nProblem [problem] tables?","o":["Task [task]","Assignment [assignment]","Service [service]","Workflow [workflow]"],"a":[0]},{"n":343,"p":94,"q":"Which of the following statements describes how data is organized in a table?","o":["A column is a field in the database and a record is one user","A column is one field and a record is one row","A column is one field and a record is one column","A column contains data from one user and a record is one set of fields"],"a":[1]},{"n":344,"p":94,"q":"What is a sys_id?","o":["Unique 32-character identifier that is assigned to every record","A client-side Business Rule","A server-side Business Rule","Unique 64-character identifier that is assigned to every record"],"a":[0]},{"n":345,"p":95,"q":"When creating a global custom table named `abc`, what is the table name that is automatically assigned by the platform?","o":["snc_abc","abc","u_abc","sys_abc"],"a":[2]},{"n":346,"p":95,"q":"Access Control rules may provide access security for which of the following database objects?","o":["For a specific role, group, or user","For a specific row, column, or table","For specific groups","For a specific CMDB Configuration item"],"a":[1]},{"n":347,"p":95,"q":"What is the primary application used to load data into ServiceNow?","o":["Service Level Management","Configuration","System Import Sets","System Update Sets"],"a":[2]},{"n":348,"p":95,"q":"Which of the following steps can be used to import new data into ServiceNow from a spreadsheet?","o":["Select Data Source, Schedule Transform","Load Data, Create Transform Map, Run Transform","Define Data Source, Select Transform Map, Run Transform","Select Import Set, Select Transform Map, Run Transform"],"a":[1]},{"n":349,"p":96,"q":"Which tool is used for creating dependencies between configuration items in the CMDB?","o":["CI Relationship Editor","CMDB Builder","CI Service Manager","Cl Class Manager"],"a":[0]},{"n":350,"p":96,"q":"Which term refers to application menus and modules which you may want to access quickly and often?","o":["Breadcrumb","Favorite","Tag","Bookmark"],"a":[1]},{"n":351,"p":96,"q":"What is the difference between a UI Policy and Data Policy?","o":["Data Policies run when data is entered through the form, by an Import Set, or by web services, while UI Policies are set only by web services","Data Policies can be converted into UI Policies, but UI Policies cannot be converted into Data Policies","Data Policies run regardless of how data is entered into ServiceNow, while UI Policies are used for form interactions","Data Policies run only after UI Policies run successfully"],"a":[2]},{"n":352,"p":96,"q":"Which one of the following is an accurate list of changes that are captured in an Update Set?","o":["Changes made to: tables, forms, schedules, and client scripts","Changes made to: tables, forms, Business Rules, and data records","Changes made to: tables, forms, groups, and configuration items (CIs)","Changes made to: table, forms, views, and fields"],"a":[3]},{"n":353,"p":97,"q":"What are the steps to retrieve an Update Set?","o":["Verify Update Set is Complete, Retrieve, Preview, Apply","Verify Update Set is Complete, Test Connection, Apply","Verify Update Set is Complete, Test Connection, Commit","Verify Update Set is Complete, Retrieve, Preview, Commit"],"a":[3]},{"n":354,"p":97,"q":"IntegrationHub enables execution of third-party APIs as a part of a flow. These integrations are referred to as","o":["an action","a spoke","a connection","an integration step"],"a":[1]},{"n":355,"p":97,"q":"Which of the following protects applications by identifying and restricting access to available files and data?","o":["Application Configuration","Verbose Log","Access Control Rules","Application Scope"],"a":[3]},{"n":356,"p":97,"q":"Which one statement correctly describes Access Control rule evaluation?","o":["Table access rules are evaluated from the general to the specific","If more than one rule applies to a record, the older rule is evaluated first","If a row level rule and a field level rule exist, both rules must be true before an operation is allowed","The role with the most permissions evaluates the rules first."],"a":[2]},{"n":357,"p":98,"q":"ServiceNow contains a resource which provides the following:\n✑ A standard and shared set of service related definitions across ServiceNow products and platform that will enable and support true service level reporting.\n✑ A CMDB framework across our products and platform that will enable and support multiple configuration strategies.\nWhat resource do these statements describe?","o":["Common Services Data Model (CSDM)","Information Technology Service Management (ITSM)","Configuration Management Database (CMDB)","Information Technology Infrastructure Library (ITIL)"],"a":[0]},{"n":358,"p":98,"q":"An IT manager is responsible for the Network and Hardware assignment groups, each group contains 5 team members. These team members are working on many tasks, but the manager cannot see any tasks on the Service Desk > My Groups Work list. What could explain this?","o":["The Service Desk > My Groups Work list shows active work tasks that are not yet assigned.","The manager does not have the itil role.","The manager is not a member of the Service Desk group.","The manager is not a member of the Network and Hardware groups.","The Assignment Group manager field is empty."],"a":[0],"img":[{"k":"p098_239.png","b":false}]},{"n":359,"p":98,"q":"What do you need to do before you can use an Application-based trigger in your flow?","o":["Activate application trigger spoke","Activate trigger security rules","Activate application spoke, and plug-ins as needed","Assign Application trigger role [sn_app_trigger_write] to SME","Activate application plugins only"],"a":[2]},{"n":360,"p":99,"q":"The ServiceNow platform includes which types of interfaces? (Choose three.)","o":["Now Mobile Apps","Agent Control Center","Back Office Dashboard","Service Portals","Now Platformֲ® User Interfaces","Field Service Taskboard"],"a":[0,3,4]},{"n":361,"p":99,"q":"What is generated from the Service Catalog once a user places an order for an item or service?","o":["A change request","An Order Guide","A request","An SLA"],"a":[2]},{"n":362,"p":99,"q":"Which of the following are not included in an Update Set, by default? (Choose four.)","o":[],"a":[]},{"n":363,"p":99,"q":"You are showing your customer a new form that you have created for their new application. They would like to add a field to the form. Where could you do that?\n(Choose two.)","o":["Select Fields and Columns module","Right click on form header, select Configure > Form Layout","Click on context menu, select Configure > Form Designer","Select Field Class Manager module"],"a":[1,2]},{"n":364,"p":100,"q":"Which ServiceNow resource is a framework that ensures the data your ServiceNow application requires maps correctly to the appropriate CMDB tables?","o":["Common Service Data Model (CSDM)","Service Mapping Utility (SMU)","Service Schema Map (SSM)","CMDB Class Manager (CMDBCM)","CI Class Manager (CICM)"],"a":[0]},{"n":365,"p":100,"q":"What do you activate when you want to add applications or functionality within your development instance?","o":["App Package","Updated Pack","Patch","Plugin","App Updated Set"],"a":[3]},{"n":366,"p":100,"q":"What field contains a record's 32-character, unique identifier?","o":["sn_rec_id","rec_id","u_id","sys_id","sn_gu_id","sn_sys_id","id"],"a":[3]},{"n":367,"p":100,"q":"Your company is giving all first line workers a special T-shirt as a recognition for their hard work. Management team wants a way for employees to order the T- shirt, with the ability to specify the preferred size and color. How would you ensure that only first line workers (non-managers) can submit the order?","o":["Create Record Producer and use the Available For list to specify First Line [sn_first_line] role","Create Catalog Item and use the Not Available list to specify the Manager Group","Create Catalog Item and use the Available For list to specify ITIL [itil] role","Create Order Guide and use the User Criteria list to specify First Line [sn_first_line] role"],"a":[1]},{"n":368,"p":101,"q":"What is used frequently to move customizations from one instance to another?","o":["Update Sets","Code Sets","Update Packs","Configuration Logs","Remote Sets","Local Sets","Code Packs"],"a":[0]},{"n":369,"p":101,"q":"What icon do you use to change the label on a Favorite?","o":["Clock","Hamburger","Pencil","Three dots","Triangle.","Star"],"a":[2]},{"n":370,"p":101,"q":"What needs to be specified, when creating a Business Rule? (Choose four.)","o":[],"a":[]},{"n":371,"p":102,"q":"What feature can track the amount of time that a task has been open, to ensure that tasks are completed within an allotted time?","o":["Task Escalation Clock","Service Level Agreements","Inactivity Monitor","Response Time Clock","Business Time Remaining"],"a":[1]}];
