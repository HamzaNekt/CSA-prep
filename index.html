const TOTAL=QS.length;
const BYN={};QS.forEach(q=>BYN[q.n]=q);
const LS={get(k,d){try{const v=localStorage.getItem("csa371."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("csa371."+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L=i=>String.fromCharCode(65+i);
const DEF={start:"2026-11-25",exam:"2026-12-08"};
let cfg=Object.assign({},DEF,LS.get("cfg",{}));
let star=new Set(LS.get("star",[]));
const saveStar=()=>LS.set("star",[...star]);
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const diff=(a,b)=>Math.round((b-a)/864e5);
const fmt=(d,o)=>d.toLocaleDateString("fr-FR",o||{weekday:"short",day:"numeric",month:"short"});
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const rlabel=ns=>ns.length?"Q"+ns[0]+" → Q"+ns[ns.length-1]:"";
function split(arr,k){const out=[];const base=Math.floor(arr.length/k),extra=arr.length%k;let p=0;for(let i=0;i<k;i++){const s=base+(i<extra?1:0);out.push(arr.slice(p,p+s));p+=s}return out}

/* ---------- planning: deterministic from dates, nothing to save ---------- */
function buildPlan(){
  const s=pd(cfg.start),e=pd(cfg.exam);let N=diff(s,e);if(N<1)N=1;
  const F=N>=2?1:0,R=N>=8?3:N>=5?1:0,Ln=Math.max(1,N-F-R);
  const all=range(1,TOTAL),batches=split(all,Ln),revs=R?split(all,R):[];
  const days=[];
  for(let i=0;i<Ln;i++){
    const sets=[{id:"new",t:"Nouvelles questions",d:"À découvrir aujourd'hui",ns:batches[i]}];
    if(i>=1)sets.push({id:"j1",t:"Révision de la veille",d:"Bloc du jour "+i,ns:batches[i-1]});
    if(i>=3)sets.push({id:"j3",t:"Rappel à 3 jours",d:"Bloc du jour "+(i-2),ns:batches[i-3]});
    if(i>=7)sets.push({id:"j7",t:"Rappel à 7 jours",d:"Bloc du jour "+(i-6),ns:batches[i-7]});
    days.push({kind:"learn",label:"Apprentissage",sets});
  }
  revs.forEach((ns,k)=>days.push({kind:"rev",label:"Révision complète "+(k+1)+"/"+R,sets:[{id:"rev",t:"Révision complète, partie "+(k+1)+" sur "+R,d:ns.length+" questions",ns}]}));
  if(F)days.push({kind:"fin",label:"Examen blanc",sets:[{id:"diff",t:"Mes questions difficiles",d:"Celles que tu as marquées d'une étoile sur cet appareil",ns:null},{id:"all",t:"Dernier passage complet",d:"Les 371 questions, en mode lecture rapide",ns:all}],exam:true});
  days.forEach((d,i)=>{d.i=i+1;d.date=addD(s,i)});
  return {days,s,e,batches};
}
let plan=buildPlan();
const dayOf=dt=>{const k=diff(plan.s,dt);return k>=0&&k<plan.days.length?plan.days[k]:null};

/* ---------- header ---------- */
function header(){
  const t=today(),left=diff(t,plan.e);
  document.getElementById("cd").textContent=left>0?"J-"+left:left===0?"Jour J":"Terminé";
  document.getElementById("cdl").textContent=left>0?"avant l'examen du "+fmt(plan.e,{day:"numeric",month:"long"}):left===0?"Bonne chance pour l'examen":"examen passé";
  const td=dayOf(t);
  document.getElementById("sub").textContent=td?"Jour "+td.i+" sur "+plan.days.length+" · "+td.label:diff(t,plan.s)>0?"Le plan commence le "+fmt(plan.s,{weekday:"long",day:"numeric",month:"long"}):"Plan de révision terminé";
  const st=document.getElementById("strip");
  const col={learn:"var(--learn)",rev:"var(--rev)",fin:"var(--fin)"};
  st.innerHTML=plan.days.map(d=>{const c=diff(t,d.date);const n=d.sets.reduce((a,s)=>a+(s.ns&&s.id==="new"?s.ns.length:0),0);
    return `<button class="tk ${c<0?"past":""} ${c===0?"today":""}" style="--c:${col[d.kind]}" data-day="${d.i}"><small>${esc(fmt(d.date,{weekday:"short"}))}</small><strong>${d.date.getDate()} ${esc(fmt(d.date,{month:"short"}))}</strong><em>${d.kind==="learn"?"+"+n+" Q":d.kind==="rev"?"Révision":"Blanc"}</em></button>`}).join("")+
    `<button class="tk exam ${diff(t,plan.e)===0?"today":""}" style="--c:#fff" data-day="exam"><small>${esc(fmt(plan.e,{weekday:"short"}))}</small><strong>${plan.e.getDate()} ${esc(fmt(plan.e,{month:"short"}))}</strong><em>Examen CSA</em></button>`;
  const on=st.querySelector(".today");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
}

/* ---------- views ---------- */
const V=document.getElementById("view");
let S=null; // current session
function setTab(v){document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===v))}

function dayView(d,isToday){
  const res=LS.get("session",null);
  let h="";
  if(isToday&&res&&res.qs&&res.i<res.qs.length)h+=`<div class="resume"><span>Session en cours : <b>${esc(res.title)}</b>, question ${res.i+1} sur ${res.qs.length}</span><button class="btn pri" data-act="resume">Reprendre</button></div>`;
  h+=`<div class="dayhead"><h2>${isToday?"Aujourd'hui, ":""}${esc(fmt(d.date,{weekday:"long",day:"numeric",month:"long"}))}</h2><span class="kind">Jour ${d.i} sur ${plan.days.length} · ${esc(d.label)}</span></div><div class="grid">`;
  d.sets.forEach(s=>{
    const ns=s.ns||[...star].sort((a,b)=>a-b);
    h+=`<div class="set"><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p><p class="rng">${ns.length?esc(rlabel(ns))+" · "+ns.length+" questions":"Aucune question marquée pour l'instant"}</p>
      <div class="modes">${["lecture","carte","quiz"].map(m=>`<button class="btn ${m==="quiz"?"pri":""}" ${ns.length?"":"disabled"} data-act="start" data-day="${d.i}" data-set="${s.id}" data-mode="${m}">${{lecture:"Lecture",carte:"Cartes",quiz:"Quiz"}[m]}</button>`).join("")}</div></div>`;
  });
  if(d.exam)h+=`<div class="set"><h3>Examen blanc</h3><p>60 questions tirées au hasard dans les 371, chronomètre de 90 minutes, comme l'examen réel.</p><div class="modes"><a class="btn pri" href="#examen-blanc" style="text-decoration:none;display:inline-flex;align-items:center">Lancer l'examen blanc</a></div></div>`;
  h+=`</div><p class="note"><b>Lecture</b> : la bonne réponse est affichée directement. <b>Cartes</b> : tu réfléchis, puis tu révèles. <b>Quiz</b> : tu réponds, puis tu vérifies. Tout le planning se calcule à partir de la date : rien ne se perd entre deux visites.</p>`;
  return h;
}
function vToday(){
  const t=today(),d=dayOf(t);
  if(d)return dayView(d,true);
  const before=diff(t,plan.s)>0;
  return `<div class="panel"><h2 style="font-size:32px">${before?"Le plan démarre "+esc(fmt(plan.s,{weekday:"long",day:"numeric",month:"long"})):diff(t,plan.e)===0?"C'est le jour J":"Le plan est terminé"}</h2><p>${before?"Tu peux déjà commencer le jour 1, ou faire un premier tour en lecture.":"Toutes les journées restent accessibles dans le planning complet."}</p><div class="modes"><button class="btn pri" data-act="goday" data-day="1">Ouvrir le jour 1</button><a class="btn" href="#planning" style="text-decoration:none;display:inline-flex;align-items:center">Planning complet</a></div></div>`;
}
function vPlanning(){
  const t=today();
  return `<div class="dayhead"><h2>Planning complet</h2><span class="kind">${TOTAL} questions · ${plan.batches.length} jours d'apprentissage</span></div><div class="table panel" style="padding:0"><table><thead><tr><th>Jour</th><th>Date</th><th>Programme</th><th></th></tr></thead><tbody>${plan.days.map(d=>`<tr${diff(t,d.date)===0?' style="background:var(--magsoft)"':""}><td class="n"><b>${d.i}</b></td><td class="n">${esc(fmt(d.date))}</td><td>${d.sets.map(s=>esc(s.t)+(s.ns?" <span style='color:var(--mute)'>("+esc(rlabel(s.ns))+")</span>":"")).join("<br>")}${d.exam?"<br>Examen blanc (60 questions)":""}</td><td><button class="btn" data-act="goday" data-day="${d.i}">Ouvrir</button></td></tr>`).join("")}<tr><td class="n"><b>🎯</b></td><td class="n">${esc(fmt(plan.e))}</td><td><b>Examen CSA</b></td><td></td></tr></tbody></table></div>`;
}
function vLib(){
  return `<div class="dayhead"><h2>Toutes les questions</h2><span class="kind" id="libc"></span></div>
  <div class="tools"><input type="search" id="q" placeholder="Rechercher un mot ou un numéro (ex. 142, ACL, Update Set)"><label class="chk"><input type="checkbox" id="onlystar">Seulement mes difficiles</label><label class="chk"><input type="checkbox" id="showans" checked>Afficher les réponses</label></div><div class="lib" id="lib"></div>`;
}
function libRender(){
  const q=(document.getElementById("q").value||"").trim().toLowerCase(),os=document.getElementById("onlystar").checked,sa=document.getElementById("showans").checked;
  let list=QS.filter(x=>!os||star.has(x.n));
  if(q){const num=/^\d+$/.test(q)?+q:null;list=list.filter(x=>num?x.n===num:(x.q+" "+x.o.join(" ")).toLowerCase().includes(q))}
  document.getElementById("libc").textContent=list.length+" question"+(list.length>1?"s":"");
  const shown=list.slice(0,80);
  document.getElementById("lib").innerHTML=shown.map(x=>`<article class="li"><header><b>Question ${x.n}</b><span>page ${x.p} du PDF <button class="star ${star.has(x.n)?"on":""}" data-act="star" data-n="${x.n}">${star.has(x.n)?"★ Difficile":"☆ Marquer"}</button></span></header>${imgs(x,true)}<div class="qt">${esc(x.q)}</div>${imgs(x,false)}${x.o.length?`<ol>${x.o.map((o,i)=>`<li class="${sa&&x.a.includes(i)?"c":""}">${L(i)}. ${esc(o)}${sa&&x.a.includes(i)?" ✓":""}</li>`).join("")}</ol>`:missing()}</article>`).join("")+(list.length>80?`<p class="note">${list.length-80} autres résultats : affine la recherche.</p>`:"");
}
function imgs(x,before){return(x.img||[]).filter(i=>i.b===before).map(i=>`<img class="qimg" alt="Illustration de la question ${x.n}" src="${IMG[i.k]}">`).join("")}
const missing=()=>`<div class="missing">Le PDF ne contient ni les options ni la réponse de cette question : le bloc « Correct answer » y est vide. Elle est affichée telle quelle et n'est pas notée en quiz.</div>`;
function vExam(){
  return `<div class="panel" style="max-width:720px"><h2 style="font-size:34px">Examen blanc</h2><p>60 questions tirées au hasard parmi les 367 questions qui ont une réponse dans le PDF. Chronomètre de 90 minutes, mode quiz, score à la fin. Chaque lancement fait un nouveau tirage.</p><div class="modes"><button class="btn pri" data-act="exam">Commencer (60 questions)</button><button class="btn" data-act="exam" data-k="30">Version courte (30)</button></div></div>`;
}
function vSettings(){
  return `<div class="dayhead"><h2>Réglages</h2></div><div class="panel"><div class="settings">
  <label for="st">Début du plan<input type="date" id="st" value="${cfg.start}"></label>
  <label for="ex">Date de l'examen<input type="date" id="ex" value="${cfg.exam}"></label>
  <div class="modes"><button class="btn pri" data-act="savecfg">Recalculer le planning</button><button class="btn" data-act="resetcfg">Valeurs par défaut</button></div></div>
  <p class="note">Le découpage dépend uniquement de ces deux dates : sur n'importe quel appareil avec les mêmes dates, le jour 3 contient toujours les mêmes questions. Par défaut : début le 25 novembre, examen le 8 décembre.</p>
  <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
  <label class="chk"><input type="checkbox" id="shuf" ${LS.get("shuf",false)?"checked":""}>Mélanger l'ordre des questions dans une session</label><br>
  <label class="chk"><input type="checkbox" id="shufq" ${LS.get("shufq",true)?"checked":""}>Mélanger l'ordre des réponses en mode quiz (activé par défaut ; la lecture et les cartes gardent l'ordre du PDF)</label>
  <p class="note">Les questions marquées « difficiles » (${star.size}) et la session en cours sont gardées dans ce navigateur seulement. <button class="btn" data-act="clearstar">Effacer mes difficiles</button></p></div>`;
}

/* ---------- sessions ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(title,ns,mode,extra){
  let qs=ns.slice();if(LS.get("shuf",false)||(extra&&extra.shuffle))qs=shuffle(qs);
  const ord={};if(mode==="quiz"&&LS.get("shufq",true))qs.forEach(n=>ord[n]=shuffle(range(0,BYN[n].o.length-1)));
  S=Object.assign({title,qs,mode,i:0,sel:{},done:{},rev:{},ord},extra||{});
  saveS();renderSession();window.scrollTo(0,0);
}
function saveS(){if(S)LS.set("session",S)}
function order(n){return S.ord&&S.ord[n]?S.ord[n]:range(0,BYN[n].o.length-1)}
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function renderSession(){
  setTab("");document.body.classList.add("insess");
  if(S.i>=S.qs.length)return renderEnd();
  const n=S.qs[S.i],x=BYN[n],mode=S.mode,done=S.done[n]!=null,sel=S.sel[n]||[],rev=mode==="lecture"||S.rev[n]||done;
  const need=x.a.length,ord=order(n),mixed=!!(S.ord&&S.ord[n]),LB=i=>L(mixed?ord.indexOf(i):i);
  let left="";if(S.deadline){const r=Math.max(0,Math.round((S.deadline-Date.now())/1000));left=` · ⏱ <span id="tm">${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}</span>`}
  let h=`<div class="sbar"><button class="btn" data-act="quit">← Quitter</button><span><b>${esc(S.title)}</b> · ${S.i+1} / ${S.qs.length}${left}</span><div class="prog"><i style="width:${(S.i/S.qs.length*100).toFixed(1)}%"></i></div></div>`;
  h+=`<div class="card panel"><div class="qmeta"><b>Question ${n}</b><span>page ${x.p} du PDF</span>${mixed?"<span>réponses mélangées</span>":""}${need>1?`<span>${need} réponses attendues</span>`:""}<button class="star ${star.has(n)?"on":""}" data-act="star" data-n="${n}">${star.has(n)?"★ Difficile":"☆ Marquer difficile"}</button></div>`;
  h+=imgs(x,true)+`<div class="qtext">${esc(x.q)}</div>`+imgs(x,false);
  if(!x.o.length)h+=missing();
  else if(mode==="carte"&&!rev)h+=`<div class="opts">${order(n).map(i=>`<div class="opt" style="cursor:default"><span class="l">${L(i)}</span><span>${esc(x.o[i])}</span><span></span></div>`).join("")}</div>`;
  else{
    h+=`<div class="opts">${order(n).map(i=>{
      let c="",m="";const isA=x.a.includes(i),isS=sel.includes(i);
      if(rev&&mode!=="quiz"){if(isA){c="good";m="Bonne réponse"}}
      else if(mode==="quiz"&&done){if(isA){c="good";m=isS?"Bonne réponse":"Réponse attendue"}else if(isS){c="bad";m="Faux"}}
      else if(isS)c="sel";
      return `<button class="opt ${c}" data-act="pick" data-i="${i}" ${mode!=="quiz"||done?"disabled":""}><span class="l">${LB(i)}</span><span>${esc(x.o[i])}</span><span class="m">${m}</span></button>`}).join("")}</div>`;
    if(mode==="quiz"&&done)h+=`<div class="verdict ${S.done[n]?"ok":"ko"}">${S.done[n]?"Correct.":"Incorrect. Bonne réponse : "+x.a.map(LB).sort().join(", ")}</div>`;
  }
  if(mode==="carte"&&rev&&x.o.length)h+=`<div class="back" style="margin-top:14px"><h3>Réponse</h3>${x.a.map(i=>`<p>${L(i)}. ${esc(x.o[i])}</p>`).join("")}</div>`;
  let main="";
  if(!x.o.length)main=`<button class="btn pri" data-act="next">Suivante →</button>`;
  else if(mode==="carte"&&!rev)main=`<button class="btn pri" data-act="reveal">Révéler la réponse</button>`;
  else if(mode==="quiz"&&!done)main=`<button class="btn pri" data-act="check" ${sel.length?"":"disabled"}>Vérifier${need>1?" ("+sel.length+"/"+need+")":""}</button>`;
  else main=`<button class="btn pri" data-act="next">${S.i+1<S.qs.length?"Suivante →":"Terminer"}</button>`;
  h+=`<div class="nav"><button class="btn" data-act="prev" ${S.i?"":"disabled"}>← Précédente</button>${main}</div></div>`;
  h+=`<p class="keys">Clavier : ← → pour naviguer · Espace pour révéler, vérifier ou passer à la suite · 1 à 7 pour choisir une option · D pour marquer difficile</p>`;
  V.innerHTML=h;
}
function renderEnd(){
  const graded=S.qs.filter(n=>BYN[n].o.length);
  const ok=graded.filter(n=>S.done[n]===true).length,bad=graded.filter(n=>S.done[n]===false);
  let h=`<div class="end panel"><h2 style="font-size:34px">Session terminée</h2><p>${esc(S.title)}</p>`;
  if(S.mode==="quiz"){const ans=graded.filter(n=>S.done[n]!=null).length;
    h+=`<div class="big">${ans?Math.round(ok/ans*100):0} %</div><p>${ok} bonnes réponses sur ${ans} questions répondues${graded.length>ans?" ("+(graded.length-ans)+" sans réponse)":""}.</p>
    <div class="dots">${graded.map(n=>`<button style="background:${S.done[n]===true?"var(--ok)":S.done[n]===false?"var(--ko)":"var(--mute)"}" data-act="jump" data-n="${n}" title="Question ${n}">${n}</button>`).join("")}</div>`;
    if(bad.length)h+=`<button class="btn pri" data-act="redo">Refaire les ${bad.length} erreurs</button> `;
  }else h+=`<p>${S.qs.length} questions parcourues.</p>`;
  h+=`<button class="btn" data-act="again">Recommencer</button> <button class="btn" data-act="quit">Retour</button></div>`;
  V.innerHTML=h;LS.set("session",null);
}
function findSet(day,id){const d=plan.days[day-1];const s=d.sets.find(s=>s.id===id);return{d,s,ns:s.ns||[...star].sort((a,b)=>a-b)}}

/* ---------- router ---------- */
function route(){
  header();document.body.classList.remove("insess");
  if(S){renderSession();return}
  const h=(location.hash||"").slice(1);let v=h||"aujourdhui";
  const m=/^jour-(\d+)$/.exec(v);
  if(m&&plan.days[+m[1]-1]){setTab("planning");V.innerHTML=dayView(plan.days[+m[1]-1],diff(today(),plan.days[+m[1]-1].date)===0);return}
  if(!["aujourdhui","planning","questions","examen-blanc","reglages"].includes(v))v="aujourdhui";
  setTab(v);
  V.innerHTML={aujourdhui:vToday,planning:vPlanning,questions:vLib,"examen-blanc":vExam,reglages:vSettings}[v]();
  if(v==="questions")libRender();
}
window.addEventListener("hashchange",()=>{S=null;route();window.scrollTo(0,0)});
document.addEventListener("input",e=>{if(["q","onlystar","showans"].includes(e.target.id))libRender();if(e.target.id==="shuf")LS.set("shuf",e.target.checked);if(e.target.id==="shufq")LS.set("shufq",e.target.checked)});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-day]");if(!b)return;
  const a=b.dataset.act;
  if(!a&&b.dataset.day){if(b.dataset.day==="exam"){location.hash="examen-blanc"}else{S=null;location.hash="jour-"+b.dataset.day}return}
  if(a==="goday"){S=null;location.hash="jour-"+b.dataset.day;return}
  if(a==="start"){const{d,s,ns}=findSet(+b.dataset.day,b.dataset.set);startSession("Jour "+d.i+" · "+s.t,ns,b.dataset.mode);return}
  if(a==="resume"){S=LS.get("session",null);if(S){if(S.deadline&&Date.now()>S.deadline)S.deadline=null;renderSession();tick()}return}
  if(a==="exam"){const pool=QS.filter(x=>x.o.length).map(x=>x.n);const k=+(b.dataset.k||60);startSession("Examen blanc ("+k+")",shuffle(pool).slice(0,k),"quiz",{deadline:Date.now()+(k===60?90:45)*60000});tick();return}
  if(a==="star"){const n=+b.dataset.n;star.has(n)?star.delete(n):star.add(n);saveStar();if(S)renderSession();else libRender&&document.getElementById("lib")?libRender():route();return}
  if(a==="savecfg"){const st=document.getElementById("st").value,ex=document.getElementById("ex").value;if(st&&ex&&pd(ex)>pd(st)){cfg={start:st,exam:ex};LS.set("cfg",cfg);plan=buildPlan();route()}return}
  if(a==="resetcfg"){cfg=Object.assign({},DEF);LS.set("cfg",{});plan=buildPlan();route();return}
  if(a==="clearstar"){star.clear();saveStar();route();return}
  if(!S)return;
  act(a,b);
});
function act(a,b){
  const n=S.qs[S.i],x=n&&BYN[n];
  if(a==="quit"){S=null;LS.set("session",null);route();return}
  if(a==="prev"&&S.i>0)S.i--;
  else if(a==="next")S.i++;
  else if(a==="reveal")S.rev[n]=true;
  else if(a==="pick"&&S.done[n]==null){const i=+b.dataset.i;let s=S.sel[n]||[];const need=x.a.length;
    if(need===1)s=[i];else s=s.includes(i)?s.filter(v=>v!==i):s.length<need?s.concat(i):s;S.sel[n]=s;
    if(need===1){S.done[n]=same(s,x.a)}}
  else if(a==="check"){const s=S.sel[n]||[];if(s.length)S.done[n]=same(s,x.a)}
  else if(a==="jump"){S.i=S.qs.indexOf(+b.dataset.n)}
  else if(a==="redo"){const bad=S.qs.filter(m=>BYN[m].o.length&&S.done[m]===false);startSession(S.title.replace(/ · erreurs$/,"")+" · erreurs",bad,"quiz");return}
  else if(a==="again"){startSession(S.title,S.qs,S.mode);return}
  saveS();renderSession();
}
document.addEventListener("keydown",e=>{
  if(!S||e.target.matches("input,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
  if(S.i>=S.qs.length)return;
  const n=S.qs[S.i],x=BYN[n];
  if(e.key==="ArrowRight"){act("next");e.preventDefault()}
  else if(e.key==="ArrowLeft"&&S.i>0){act("prev");e.preventDefault()}
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();const mb=V.querySelector(".nav .btn.pri");if(mb&&!mb.disabled)mb.click()}
  else if(/^[1-7]$/.test(e.key)&&S.mode==="quiz"&&S.done[n]==null){const pos=+e.key-1,o=order(n);if(pos<o.length){const fake={dataset:{i:o[pos]}};act("pick",fake)}}
  else if(e.key==="d"||e.key==="D"){star.has(n)?star.delete(n):star.add(n);saveStar();renderSession()}
});
let timer=null;
function tick(){clearInterval(timer);timer=setInterval(()=>{if(!S||!S.deadline){clearInterval(timer);return}const r=Math.max(0,Math.round((S.deadline-Date.now())/1000));const el=document.getElementById("tm");if(el)el.textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");if(r===0){clearInterval(timer);S.i=S.qs.length;renderSession()}},1000)}
route();
}
</script>
</body>
</html>
