<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSA Révision 371</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;800&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and focused, works daily until the exam
   IDEA a revision planner strip: one ticket per day until 8 December, today punched
   PICTURE the 14-day strip in the top band, each day a ticket coloured by its kind
   COLOUR oxford blue band, white panels, magenta for results and today; green/red only for right/wrong
   TYPE Red Hat Display + Red Hat Text
   LAYOUT band with title, countdown and strip; below, today's sets; session = one large centred card */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f9,#0b1020);--panel:light-dark(#ffffff,#141b31);--ink:light-dark(#0e1530,#e8ebf5);--mute:light-dark(#566086,#9aa3c2);--line:light-dark(#dfe3ee,#27304d);--band:#0b1f4b;--band2:#13306e;--mag:#e0115f;--magsoft:light-dark(#fde7ef,#3a1022);--ok:light-dark(#0f8a4a,#3fd68a);--oksoft:light-dark(#e3f6ec,#0f2c1e);--ko:light-dark(#c62828,#ff6b6b);--kosoft:light-dark(#fdeaea,#341515);--learn:#4f7cff;--rev:#f5a524;--fin:#e0115f}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Red Hat Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Red Hat Display",system-ui,sans-serif;line-height:1.08;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.band{background:var(--band);color:#fff;padding:clamp(20px,3vw,40px) max(4vw,16px) 22px}
.wrap{max-width:1120px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:clamp(30px,4.4vw,46px);font-weight:800}
.top p{margin:6px 0 0;color:#c9d3f2}
.count{text-align:right}
.count b{display:block;font:800 clamp(40px,6vw,64px)/1 "Red Hat Display",sans-serif;color:#fff}
.count span{color:#c9d3f2;font-size:14px}
.strip{display:flex;gap:8px;overflow-x:auto;margin-top:22px;padding:4px 2px 10px;scroll-snap-type:x proximity}
.tk{flex:1 0 76px;min-height:92px;border:0;border-radius:10px;background:var(--band2);color:#fff;padding:9px 9px 8px;text-align:left;position:relative;scroll-snap-align:start;display:flex;flex-direction:column;gap:2px}
.tk::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:10px 10px 0 0;background:var(--c)}
.tk small{font-size:13px;color:#c9d3f2}
.tk strong{font:700 20px/1.1 "Red Hat Display",sans-serif}
.tk em{font-style:normal;font-size:13px;color:#e4e9fb;margin-top:auto}
.tk.past{opacity:.55}
body.insess .band{display:none}
.tk.today{background:#fff;color:var(--band);box-shadow:0 0 0 3px var(--mag)}
.tk.today small,.tk.today em{color:#3b4a78}
.tk.exam{background:var(--mag)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#c9d3f2;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
nav.tabs a{color:#fff;text-decoration:none;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:600;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
nav.tabs a.on{background:#fff;color:var(--band)}
main{padding:24px max(4vw,16px) 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.4vw,28px)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dayhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:16px}
.dayhead h2{font-size:clamp(26px,3.4vw,36px)}
.kind{font-weight:600;color:var(--mute)}
.set{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.set h3{font-size:20px}
.set p{margin:0;color:var(--mute);font-size:15px}
.set .rng{font-weight:600;color:var(--ink)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--mag)}
.btn.pri{background:var(--mag);border-color:var(--mag);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default}
.note{font-size:14px;color:var(--mute);margin:14px 0 0}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--magsoft);border:1px solid color-mix(in srgb,var(--mag) 35%,transparent);border-radius:12px;padding:12px 16px;margin-bottom:16px}
/* session */
.sbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:var(--mag);transition:width .25s}
.card{max-width:820px;margin:0 auto}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--mute);font-size:14px;margin-bottom:10px}
.qmeta b{font:800 22px "Red Hat Display",sans-serif;color:var(--ink)}
.star{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;min-height:36px;font-size:14px}
.star.on{background:var(--magsoft);border-color:var(--mag);color:var(--mag);font-weight:600}
.qtext{font-size:clamp(18px,2.1vw,21px);line-height:1.45;white-space:pre-line;margin:6px 0 18px;font-weight:500}
.qimg{display:block;max-width:100%;height:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:8px;background:#fff}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px;min-height:48px}
.opt .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--bg);font-size:14px}
.opt .m{font-size:13px;font-weight:700;white-space:nowrap}
.opt.sel{border-color:var(--mag)}
.opt.sel .l{background:var(--mag);color:#fff}
.opt.good{border-color:var(--ok);background:var(--oksoft)}
.opt.good .l{background:var(--ok);color:#fff}
.opt.good .m{color:var(--ok)}
.opt.bad{border-color:var(--ko);background:var(--kosoft)}
.opt.bad .l{background:var(--ko);color:#fff}
.opt.bad .m{color:var(--ko)}
.opt[disabled]{cursor:default}
.missing{border:1.5px dashed var(--rev);border-radius:10px;padding:12px 14px;font-size:15px}
.back{border:1.5px solid var(--line);border-radius:12px;padding:16px;background:var(--oksoft)}
.back h3{font-size:15px;color:var(--ok);margin-bottom:8px}
.back p{margin:4px 0;font-weight:600}
.verdict{margin-top:14px;font-weight:700}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--ko)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
.keys{font-size:13px;color:var(--mute);margin-top:14px;text-align:center}
.end{text-align:center;max-width:620px;margin:20px auto}
.end .big{font:800 clamp(56px,9vw,88px)/1 "Red Hat Display",sans-serif;color:var(--mag)}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:16px 0}
.dots button{width:30px;height:30px;border-radius:6px;border:0;font-size:12px;font-weight:700;color:#fff}
/* library */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
input[type=search],input[type=date],input[type=number]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-height:44px}
input[type=search]{flex:1 1 260px}
.lib{display:flex;flex-direction:column;gap:10px}
.li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.li header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute)}
.li header b{color:var(--ink);font-family:"Red Hat Display",sans-serif;font-size:17px}
.li .qt{white-space:pre-line;margin:6px 0}
.li ol{margin:0;padding-left:0;list-style:none;font-size:15px}
.li li{padding:2px 0}
.li li.c{color:var(--ok);font-weight:600}
label.chk{display:inline-flex;gap:8px;align-items:center;min-height:44px}
label.chk input{width:20px;height:20px;accent-color:var(--mag)}
.settings{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));align-items:end}
.settings label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n{white-space:nowrap}
@media(max-width:600px){.count{text-align:left}.tk{flex-basis:70px}.opt{grid-template-columns:30px minmax(0,1fr)}.opt .m{grid-column:2}.nav .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="top">
      <div>
        <h1>CSA, 371 questions</h1>
        <p id="sub">Plan de révision jusqu'à l'examen</p>
      </div>
      <div class="count"><b id="cd">–</b><span id="cdl">jours avant l'examen</span></div>
    </div>
    <div class="strip" id="strip" aria-label="Calendrier de révision"></div>
    <div class="legend"><span><i style="background:var(--learn)"></i>Apprentissage + révisions espacées</span><span><i style="background:var(--rev)"></i>Révision complète</span><span><i style="background:var(--fin)"></i>Examen blanc / examen</span></div>
    <nav class="tabs" id="tabs">
      <a href="#aujourdhui" data-v="aujourdhui">Aujourd'hui</a>
      <a href="#planning" data-v="planning">Planning complet</a>
      <a href="#questions" data-v="questions">Toutes les questions</a>
      <a href="#examen-blanc" data-v="examen-blanc">Examen blanc</a>
      <a href="#reglages" data-v="reglages">Réglages</a>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<script>
{
const QS=[{"n":1,"p":1,"q":"A Service Catalog may include which of the following components?","o":["Order Guides, Exchange Rates, Calendars","Order Guides, Catalog Items, and Interceptors","Catalog Items, Asset Contracts, Task Surveys","Record Producers, Order Guides, and Catalog Items"],"a":[3]},{"n":2,"p":1,"q":"From the User menu, which actions can a user select? (Choose three.)","o":["Send Notifications","Log Out ServiceNow","Elevate Roles","Impersonate Users","Order from Service Catalog","Approve Records"],"a":[1,2,3]},{"n":3,"p":1,"q":"What is a quick way to create a report from a list view?","o":["Click on filter breadcrumb, drag and drop on the Report > Create New module","Click Funnel, define filter conditions, click Create Report","Click Context Menu, select Create Report","Apply filter, right click on column header, select Bar Chart","Apply filter, right click on column header, select Create Report"],"a":[3]},{"n":4,"p":1,"q":"What import utility do you use when the field names on the import set match the name of the fields on the Target table?","o":["Schema Mapping","Automatic Mapping","Mapping Assist","Mapping Dashboard"],"a":[1]},{"n":5,"p":2,"q":"As an IT employee what interface would you use, if you wanted to browse internal IT documentation, like troubleshooting scripts and FAQs?","o":["Knowledge","ServiceNow Wiki","Knowledge Now","SharePoint","Stack Overflow"],"a":[0]},{"n":6,"p":2,"q":"A new Service Desk employee in Latin America complains that the create dates and times are incorrect on their Incident list. What would you suggest to fix this issue?","o":["Have them clear their cache.","Have them use the gear icon to set the employee's time zone.","Recommend they use Chrome, instead of Explorer.","Use the system properties to correct the instance's time zone.","Have them correct the time zone on their computer."],"a":[1]},{"n":7,"p":2,"q":"What are three security modules often used by the System Administrator? (Choose three.)","o":["System Properties > Security","Utilities > Migrate Security","System Security > Security","Self-Service > My Access","System Security > Access Control (ACL)","Password Management > Security Questions","System Security > High Security Settings"],"a":[0,4,6]},{"n":8,"p":3,"q":"When testing a catalog item, having a manager approval flows, which of these best practices would you follow? (Choose three.)","o":["Make sure the latest flows are activated.","Use the instance Incognito setting to quickly toggle between requester and approver.","Impersonate the requester to ensure the form works.","Make sure the requester's user record has a manager specified.","Create and select your Testing Update Set, before starting the test cases.","Use your Admin account, so you can approve the items quickly."],"a":[0,2,3]},{"n":9,"p":3,"q":"What is a no-code approach to control the mandatory or read-only state of a form field?","o":["UI Action","Client Script","UI Script","UI Rule","UI Policy"],"a":[4]},{"n":10,"p":3,"q":"When moving multiple update sets at one time, what might you do to facilitate the move?","o":["Batch","Verify","Test","Preview"],"a":[0]},{"n":11,"p":3,"q":"What is specified in an Access Control rule?","o":["Groups, Conditional Expressions and Workflows","Table Schema, CRUD, and User Authentication","Object and Operation being secured; Permissions required to access the object","security_admin"],"a":[2]},{"n":12,"p":4,"q":"Which icon would you double click, to expand and collapse the list of all Applications and Modules?","o":["Star","Clock","Application","Funnel"],"a":[2],"img":[{"k":"p004_39.png","b":false}]},{"n":13,"p":4,"q":"Buttons, form links, and context menu items are all examples of what type of functionality?","o":["Business Rule","UI Action","Client Script","UI Policy"],"a":[1]},{"n":14,"p":4,"q":"What do you call any component that needs to be managed in order to deliver services?","o":["CSDM Items","CMDB","Configuration item","Service Offerings","Asset"],"a":[2]},{"n":15,"p":5,"q":"A new service catalog item is being developed, but should only be visible to managers inside the HR Department. What method would you use to fulfill this requirement?","o":["Specify the Dept_Mgr role on the catalog content block","Add the Department Manager group to the catalog item's user criteria","Add the Department Manager group to the catalog item's ACL","Only publish the item in the HR service catalog","Use a Dept_Mgr ACL on the HR service catalog"],"a":[1]},{"n":16,"p":5,"q":"A user wants to create a set of filter conditions, where they want to show records which satisfy two conditions: ✑ Incidents where the state is Closed\n✑ Incidents where Assignment Group is Network\nAfter clicking the Funnel icon, what should the user do?","o":["Define the first condition; click AND button; define second condition; click Run","Define the first condition; click AND button; define second condition; press enter","Define the first condition; click OR button; define second condition; press enter","Define the first condition; click > icon on breadcrumb, define second condition; click Run","Define the first condition; click > icon on breadcrumb, define second condition; press enter"],"a":[0]},{"n":17,"p":5,"q":"Access Control rules are applied to a specific table, like the Incident table. What is the object name for a rule that is specific to the Incident table and the Major\nIncident field?","o":["Incident.Major_Incident","incident=>major_incident","incident<=>major_incident","incident||major_incident","incident.major_incident"],"a":[4]},{"n":18,"p":6,"q":"Two departments (HR Onboarding and Facilities) have come to you, asking for a way for employees to request event room set up services. The requirements are the same for the form and the task routing to the Facilities' assignment group.\n✑ For HR, the item will be used primarily for the Onboarding coordinators, for employee orientation sessions. ✑ For Facilities, the item will be used for anyone in the company who needs room set up services. However, both departments have their own service catalogs. What do you do, to support these requirements?","o":["Create one Catalog Item for HR Event Room Set Up and one for Facilities Event Room Set Up; then publish each to the appropriate Catalog.","Create one Catalog Item for Event Room Set Up; then publish to both Catalogs.","Create one Catalog Item for Event Room Set Up; then publish to the Parent Catalog, which is accessible to both HR and Facilities.","Create one Catalog Item for Event Room Set Up; then use ACLs to control access."],"a":[1]},{"n":19,"p":6,"q":"After finishing your work on High Security Settings, what do you do to return to normal admin security levels?","o":["Select Normal role","Log out and back in","Use System Administration > Normal Security module","Select Global Update Set","End Impersonation"],"a":[1]},{"n":20,"p":6,"q":"What type of field allows you to look up values from one other table?","o":["Reference","Verity","Options","Selections","Dot walk","Lookup"],"a":[0]},{"n":21,"p":7,"q":"Which module would you use to create a new automation of business logic such as approvals, tasks, and notifications?","o":["Process Automation > Flow Designer","Process Automation > Flow Administration","Process Automation > Workflow Editor","Process Automation > Process Flow","Process Automation > Active Flows"],"a":[0]},{"n":22,"p":7,"q":"A department manager asks an analyst to build some reports. Where do you recommend the analyst start?","o":["Report Dashboard > Create New","Reports > Getting Started","Performance Analytics > Reports","Self-Service > Reports","Reports > Create New"],"a":[4]},{"n":23,"p":7,"q":"What are the steps for applying an update set to an instance?","o":["Retrieve, Preview, Commit","Specify, Transform, Apply","Retrieve, Assess, Apply","Get, Test, Push","Pull, Review, Push"],"a":[0]},{"n":24,"p":7,"q":"Which of the following is true of Service Catalog Items in relation to the Service Catalog?","o":["They run behind the scenes.","They are the building blocks.","They are optional.","They provide options."],"a":[1]},{"n":25,"p":8,"q":"When importing spreadsheet data into ServiceNow, in which step does the data get written to the receiving table?","o":["Run Transform","Run Import","Import Dataset","Execute Transform","Schedule Transform"],"a":[0]},{"n":26,"p":8,"q":"What would you do, on a list, if you wanted to show the records in groups, based on the column category? (Choose two.)","o":["On list Context Menu, select Group By > Category","On the Filter Menu, select Group By > Category","Click Group On icon, select Category","On Navigator Filter, type tablename.group.category and press enter","On the Category column title, click Context menu > Group By Category"],"a":[0,4]},{"n":27,"p":8,"q":"Which collaboration tool is available from the banner, using the bubble icon?","o":["Now Messenger","Agent Chat","Connect Chat","Collaborate Now","Live Feed"],"a":[2],"img":[{"k":"p008_50.png","b":false}]},{"n":28,"p":8,"q":"On the knowledge base record, which tab would you use to define which users are not able to write articles to the knowledge base?","o":["Can Contribute","Cannot Author","Cannot Contribute","Cannot Write","Read Only"],"a":[2]},{"n":29,"p":9,"q":"Which features allow you to update multiple records at one time? (Choose two.)","o":["List Editor","Field Update Action","Bulk Record Update","Data Remediation Dashboard","Update Selected Action"],"a":[0,4]},{"n":30,"p":9,"q":"Categories in the knowledge base, by default, can be created and edited by which knowledge workers? (Choose two.)","o":["Knowledge Authors","Knowledge Contributors","Knowledge Controller","Knowledge Managers","Knowledge Category Managers","Knowledge Submitters","Knowledge Owners","Knowledge Taxonomy Owner"],"a":[1,3]},{"n":31,"p":9,"q":"Which collaboration tool opens a sidebar and allows you to create new conversations with other ServiceNow users?","o":["Skype Now","Collaborate Now","Agent Messenger","Agent Chat","Connect Chat"],"a":[4]},{"n":32,"p":10,"q":"What module would you use if you wanted to view a list of all of the fields on the Incident table? (Choose two.)","o":["Tables & Columns","Dictionary","Data Class Manager","Dictionary Dashboard","Database View","Schema"],"a":[0,1]},{"n":33,"p":10,"q":"What component causes a flow to run after a record has been created or updated?","o":["Date-based trigger","On-change trigger","Record-based trigger","Application-based trigger","Updated-date trigger"],"a":[2]},{"n":34,"p":10,"q":"What type of field is Boolean and appears as a check box?","o":["Yes/No","True/False","On/Off","Binary","0/1"],"a":[1]},{"n":35,"p":11,"q":"Table Access Control rules are processed in the following order:","o":["any table name (wildcard), parent table name, table name","table name, parent table name, any table name (wildcard)","parent table name, table name, any table name (wildcard)","any table name (wildcard), table name, parent table name"],"a":[1]},{"n":36,"p":11,"q":"Which module is used to access the knowledge bases which are available to you?","o":["Knowledge > Home","Self Service > Knowledge","Knowledge > All","Knowledge > Knowledge Bases","Knowledge > Overview"],"a":[1]},{"n":37,"p":11,"q":"A customer requests the following data quality measures be added:\n✑ Incident numbers should be read only, on all lists and forms, for all users.\n✑ Short Description field should be mandatory, on all records, across all applications, on Insert. Which type of policy would you use to meet this requirement?","o":["Data Quality Policy","Dictionary Design Policy","UI Data Policy","UI Policy","Field Criteria Policy","Data Policy"],"a":[5]},{"n":38,"p":11,"q":"What type of user (persona) has clearly defined paths and workflows in the platform and have one or more roles (ie itil and approver_user)?","o":["Workflow User","Request Fulfiller","ITSM User","Approving Manager","Service Desk User","Process User"],"a":[5]},{"n":39,"p":12,"q":"Which module would you use to customize your instances banner image, text and colors?","o":["System UI > UI Pages > Branding","Service Portal > Portals > Branding","System Properties > Basic Configuration UI16","System Properties > Branding","Homepage Admin > Pages > Branding"],"a":[2]},{"n":40,"p":12,"q":"Which database provides a logical model of your company infrastructure by identifying, controlling, maintaining and verifying CIs that exist?","o":["IMDB","ITSM","CSDM","CMDB","LDAP"],"a":[3]},{"n":41,"p":12,"q":"Which module is used as the first step for importing data?","o":["Coalesce Data","Transform Data","Import Data","Load Data"],"a":[3]},{"n":42,"p":13,"q":"When you need to orchestrate business processes across services with little technical user knowledge, which utility would you use?","o":["Flow Manager","Flow Designer","Flow Editor","Workflow Editor","Workflow Designer"],"a":[1]},{"n":43,"p":13,"q":"When a user reports that they are not able to see modules on the application navigator, what can you do, to see what modules are visible to them?","o":["Look up their password, so you can login with their account","Initiate a Connect Chat session","Install the Bomgar plug-in","Impersonate the user","Launch a NowChat window"],"a":[3]},{"n":44,"p":13,"q":"What is a key difference between Reporting and Performance Analytics?","o":["Performance Analytics contains snapshots of data taken over time; Reporting shows only the data as it is, at the moment the report is run.","Performance Analytics can show trends; Reports cannot.","Reports can be run on a scheduled basis; Performance Analytics cannot.","Performance Analytics data can be published to Dashboards; Reports cannot.","Performance Analytics shows KPIs; Reporting does not."],"a":[0]},{"n":45,"p":13,"q":"While showing a customer their incident form, they ask to change the Priority values to display their internal terminology P1, P2, P3, P4. They want it to be consistent across all Tasks. How would you do that? R ing runtime value","Data pill runtime value","Input runtime value"],"a":[3]},{"n":75,"p":22,"q":"The wait time for end users is based on the round-trip between the client and the server. What activities are included in the round-trips?","o":["Request + Response","Save + Update","Write + Read","Submit + Query","Insert + Verify"],"a":[0]},{"n":76,"p":22,"q":"When importing data, what happens to imported rows, if no coalesce field is specified?","o":["All rows are rejected from the import, as coalesce field is required.","All rows are treated as new records. No existing records are updated.","Duplicate rows are rejected from the import.","All rows are treated as new records, but errors will be flagged in the import log."],"a":[1]},{"n":77,"p":22,"q":"What is the most common role that has access to almost all platform features, functions, and data?","o":["Security Admin [security_admin]","Sys Admin [sys_admin]","Admin [sn_admin]","System Administrator [admin]","Base Admin [base_admin]"],"a":[3]},{"n":78,"p":22,"q":"What feature do you use to specify which users are able to access a Service Catalog Item?","o":["Can Read Role","Catalog User Role","Can Order Tab","User Criteria"],"a":[3]},{"n":79,"p":23,"q":"Which one of the following statements is a recommendation from ServiceNow about Update Sets?","o":["Avoid using the Default Update set as an Update Set for moving customizations from instance to instance","Before moving customizations from instance to instance with Update Sets, ensure that both instances are different versions","Use the Baseline Update Set to store the contents of items after they are changed the first time","Once an Update Set is closed as ג€Completeג€, change it back to ג€In Progressג€ until it is applied to another instance"],"a":[0]},{"n":80,"p":23,"q":"Which component of a table contains a piece of data for one record?","o":["Factor","Field","Datapoint","Element","Item"],"a":[1]},{"n":81,"p":23,"q":"What type of field has a drop down list, from which you can pick from pre-defined options?","o":["Choice","Picker","Drop down","Option"],"a":[0]},{"n":82,"p":23,"q":"User records are stored in which table?","o":["User [sys_user]","User [sn_user]","User [u_sys_user]","User [s_user]"],"a":[0]},{"n":83,"p":24,"q":"What ServiceNow feature can be triggered by events, and is used to inform users about activities or updates in ServiceNow?","o":["Notifications","Alerts","Texts","Events","Emails"],"a":[0]},{"n":84,"p":24,"q":"Which ServiceNow capability allows you to provide knowledge articles, via a conversational messaging interface?","o":["Agent Assist","Virtual Agent","Now Messenger","Connect Agent"],"a":[1]},{"n":85,"p":24,"q":"Which role can manage multiple knowledge bases?","o":["knowledge_base_admin","kb_admin","sn_kb_admin","knowledge_admin"],"a":[3]},{"n":86,"p":24,"q":"Which statement correctly describes the differences between a Client Script and a Business Rule?","o":["A Client Script executes before a record is loaded and a Business Rule executes after a record is loaded","A Client Script executes on the server and a Business Rule executes on the client","A Client Script executes on the client and a Business Rule executes on the server","A Client Script executes before a record is loaded and a Business Rule executes after a record is updated"],"a":[2]},{"n":87,"p":25,"q":"What are benefits of assigning work tasks to a group, rather than to an individual? (Choose four.)","o":["Group members can choose their tasks from My Groups Work","Groups can assign tasks to users based on on-call schedules","Site support members can pick tasks, based on Location","Groups can assign tasks to users based on skills","Group members can avoid tasks, which are nearing SLA breach","Groups can assign tasks to users based on availability"],"a":[0,1,3,5]},{"n":88,"p":25,"q":"What ServiceNow feature allows you to include data from a secondary related table on a report?","o":["SQL","Dot Walking","Outer Join","Joins"],"a":[1]},{"n":89 cess List","Can Access","Accessible to","Can Read"],"a":[3]},{"n":97,"p":27,"q":"What are the main components of the Form Design interface? (Choose three.)","o":["Field Layout","Page Header","Field Navigator","Field Picker","Form Layout"],"a":[1,2,4]},{"n":98,"p":28,"q":"What is used to determine user access to knowledge bases or a knowledge article?","o":["sn_kb_read, sn_article_read","Privacy Settings","Read Access Flag","User Criteria"],"a":[3]},{"n":99,"p":28,"q":"What are the three key tables in an enterprise CMDB? (Choose three.)","o":["cmdb","sn_cmdb_bak","cmdb_rel_ci","sn_cmdb","cmdb_bak","cmdb_ci","sn_cmdb_ci"],"a":[0,2,5]},{"n":100,"p":28,"q":"What is the best practice related to using the Default Update Set for moving customizations between instances?","o":["Merge Default update sets before moving between instances","Submit Default update set to application repository","You should not use the Default Update sets for moving between instances","Keep Default update set to maximum of 20 records, for troubleshooting purposes"],"a":[2]},{"n":101,"p":28,"q":"For Administrators creating new Service Catalog items, what is a characteristic they should know about Service Catalog variables?","o":["Service Catalog variables can only be used in Record Producers","Service Catalog variables can only be used in Order Guides","Service Catalog variables cannot affect the order price","Service Catalog variables are global by default"],"a":[3]},{"n":102,"p":29,"q":"On what part of the ServiceNow instance, would you find the option to Impersonate User?","o":["Module","Content Frame","Application Navigator","Banner"],"a":[3]},{"n":103,"p":29,"q":"Which application is used primarily to load data into ServiceNow?","o":["Import Hub","System Import Sets","Data Import Configuration","Import Management"],"a":[1]},{"n":104,"p":29,"q":"If a knowledge base has no access details specified, what users are able to read articles in that knowledge base?","o":["itil users","Any user with an a
